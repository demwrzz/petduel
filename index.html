    const WHEEL_COLORS = ["#00a870", "#f08a00", "#3b82f6", "#a855f7", "#ef4444", "#14b8a6", "#eab308", "#ec4899", "#6366f1", "#84cc16"];

    function wheelSVG(players) {
      const n = players.length;
      const cx = 160, cy = 160, R = 150;
      const point = (angle, r) => [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];

      let body = "";

      if (n === 1) {
        body = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${WHEEL_COLORS[0]}"/>
          <text x="${cx}" y="${cy - 60}" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">${esc(players[0].username.slice(0, 14))}</text>`;
      } else {
        body = players.map((p, i) => {
          const a0 = (i / n) * Math.PI * 2 - Math.PI / 2;
          const a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2;
          const [x0, y0] = point(a0, R);
          const [x1, y1] = point(a1, R);
          const mid = (a0 + a1) / 2;
          const [tx, ty] = point(mid, R * 0.64);
          const size = n > 20 ? 8 : n > 12 ? 10 : 13;

          return `<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${n === 2 ? 1 : 0} 1 ${x1} ${y1} Z" fill="${WHEEL_COLORS[i % WHEEL_COLORS.length]}" stroke="#14171f" stroke-width="2"/>
            <text transform="translate(${tx} ${ty}) rotate(${(mid * 180) / Math.PI})" text-anchor="middle" dominant-baseline="middle"
              fill="#fff" font-weight="800" font-size="${size}">${esc(p.username.slice(0, 11))}</text>`;
        }).join("");
      }

      return `<svg viewBox="0 0 320 320">${body}<circle cx="${cx}" cy="${cy}" r="16" fill="#14171f" stroke="#fff" stroke-width="3"/></svg>`;
    }

    function evRow(p, out, winnerId) {
      return `<div class="ev-row ${out ? "out" : ""} ${winnerId && winnerId === p.id ? "win" : ""}" data-pid="${esc(p.id)}">${avatar(p, "sm")}<span>${esc(p.username)}</span></div>`;
    }

    function wheelPageHTML(ev) {
      const joining = ev.status === "joining";
      const finished = ev.status === "finished";
      const shown = joining ? asArray(ev.participants) : asArray(ev.players);
      const joined = ME && asArray(ev.participants).some(p => p.id === ME.id);
      const isHost = ME && ev.host.id === ME.id;

      let rotClass = "";
      if (joining) rotClass = "idle";
      else if (ev.status === "running" && ev.phase === "spin") rotClass = "fast";

      let status = "";

      if (joining) {
        status = `<div class="ev-status">Joining ends in <b class="ticker-giveaway" data-end="${Number(ev.joinEndsAt)}"></b></div>` +
          (isHost ? '<p class="hint" style="text-align:center">You are the host.</p>'
            : joined ? '<button class="btn gray" disabled>✔ You joined</button>'
              : '<button class="btn sun" data-action="event-join">Join the wheel</button>');
      } else if (finished) {
        status = ev.winner
          ? `<div class="ev-winner">🏆 ${esc(ev.winner.username)} won!${prizeHTML(ev.prize)}</div>`
          : `<div class="ev-status">${esc(ev.note || "The event has ended.")}</div>`;
      } else if (ev.phase === "reveal") {
        status = '<div class="ev-status" id="wheelMsg"></div>';
      } else {
        status = `<div class="ev-status">Round ${Number(ev.round)} · spinning…</div>`;
      }

      const wheel = shown.length
        ? `<div class="wheel-box"><div class="wheel-pointer"></div><div class="wheel-rot ${rotClass}" id="wheelRot">${wheelSVG(shown)}</div></div>`
        : `<div class="wheel-box"><div class="wheel-empty">Waiting for players to join…</div></div>`;

      const winnerId = ev.winner && ev.winner.id;

      return `
        <div class="card profile-card enter">
          <div class="ev-head">
            <h2>🎡 Wheel Event</h2>
            ${prizeHTML(ev.prize)}
            <button class="btn gray" data-action="home">← Back</button>
          </div>

          <div class="ev-grid">
            <div class="ev-center">${wheel}${status}</div>

            <div class="ev-list">
              <h4>${joining ? "Joined" : "Still in"} (${shown.length})</h4>
              ${shown.map(p => evRow(p, false, winnerId)).join("") || '<div class="empty" style="padding:20px">Nobody yet</div>'}
              ${asArray(ev.eliminated).length ? `<h4>Eliminated</h4>${asArray(ev.eliminated).map(p => evRow(p, true, "")).join("")}` : ""}
            </div>
          </div>
        </div>`;
    }

    function scramblePageHTML(ev) {
      const running = ev.status === "running";
      const isHost = ME && ev.host.id === ME.id;
      const tiles = String(ev.scrambled || "").split("").map(c => `<span class="tile">${esc(c)}</span>`).join("");

      let bottom;

      if (running) {
        bottom = `<div class="ev-status">Time left <b class="ticker-giveaway" data-end="${Number(ev.endsAt)}"></b></div>` +
          (isHost
            ? '<p class="hint" style="text-align:center">You are the host and cannot play.</p>'

      } else {
        bottom = (ev.winner
          ? `<div class="ev-winner">🏆 ${esc(ev.winner.username)} solved it!${prizeHTML(ev.prize)}</div>`
          : `<div class="ev-status">${esc(ev.note || "The event has ended.")}</div>`) +
          (ev.word ? `<p class="hint" style="text-align:center;font-size:14px">The word was <b>${esc(ev.word)}</b></p>` : "");
      }

      return `
        <div class="card profile-card enter">
          <div class="ev-head">
            <h2>🔤 Word Scramble</h2>
            ${prizeHTML(ev.prize)}
            <button class="btn gray" data-action="home">← Back</button>
          </div>

          <p class="hint" style="text-align:center;font-size:14px">Unscramble the letters (${Number(ev.length)} letters). The first correct answer wins the prize!</p>
          <div class="tiles">${tiles}</div>
          ${bottom}
        </div>`;
    }

    /* land the wheel on the eliminated player (result is only known at the reveal phase) */
    function landWheel(ev) {
      const rot = $("#wheelRot");
      if (!rot) return;

      const index = asArray(ev.players).findIndex(p => p.id === ev.victimId);
      if (index < 0) return;

      const segment = 360 / ev.players.length;
      const finalAngle = 1440 - (index + 0.5) * segment;

      rot.style.animation = "none";
      rot.style.transform = "rotate(0deg)";
      void rot.offsetWidth;
      rot.style.transition = "transform 1.8s cubic-bezier(.12,.6,.15,1)";
      rot.style.transform = `rotate(${finalAngle}deg)`;

      const victim = ev.players[index];
      const id = ev.victimId;

      setTimeout(() => {
        const row = document.querySelector(`[data-pid="${CSS.escape(String(id))}"]`);
        if (row) row.classList.add("out");

        const msg = $("#wheelMsg");
        if (msg) msg.innerHTML = `💀 <b>${esc(victim.username)}</b> is eliminated!`;
      }, 1800);
    }

    function renderEventPage(force) {
      const box = $("#eventView");
      if (!box) return;

      const ev = STATE.event;
      const sig = eventKey(ev) + "|" + (ME && ME.id);

      if (!force && sig === eventSig) return;
      eventSig = sig;

      if (!ev) {
        box.innerHTML = `
          <div class="card profile-card enter">
            <div class="empty">There is no active event right now.</div>
            <div style="text-align:center"><button class="btn gray" data-action="home">← Back</button></div>
          </div>`;
        return;
      }

      box.innerHTML = ev.type === "wheel" ? wheelPageHTML(ev) : scramblePageHTML(ev);

      if (ev.type === "wheel" && ev.status === "running" && ev.phase === "reveal") landWheel(ev);
      if (ev.type === "scramble" && ev.status === "running") setTimeout(() => { const i = $("#guessInput"); if (i) i.focus(); }, 50);
    }

    async function joinEvent() {
      if (!requireLogin()) return;
      const ev = STATE.event;
      if (!ev) return;

      try {
        await api("/api/event/join", { body: { id: ev.id } });
        toast("You joined the wheel!", "ok");
      } catch (error) { fail(error); }
    }

    async function submitGuess() {
      if (!requireLogin()) return;

      const ev = STATE.event;
      const input = $("#guessInput");
      if (!ev || !input) return;

      const guess = input.value.trim();
      if (!guess) return;

      try {
        const result = await api("/api/event/guess", { body: { id: ev.id, guess } });
        input.value = "";
        if (result.correct) toast("Correct! 🎉", "ok");
        else { toast("Wrong answer, try again", "err"); input.focus(); }
      } catch (error) { fail(error); }
    }

    /* ---------- Leaderboard ---------- */
    async function showLeaderboard(by = "totalBet") {
      gridContext = null;
      viewMatchId = null;
      clearReplay();

      openModal(`
        ${modalHeader("🏆 Leaderboard")}
        <div class="seg" id="lbTabs">
          <button data-action="lb-tab" data-by="totalBet">Most Wagered</button>
          <button data-action="lb-tab" data-by="profit">Top Profit</button>
        </div>
        <div id="lbBody"><div class="empty">Loading…</div></div>`, "small");

      loadLeaderboard(by);
    }

    async function loadLeaderboard(by) {
      document.querySelectorAll("#lbTabs button").forEach(b => b.classList.toggle("on", b.dataset.by === by));

      try {
        const { list } = await api("/api/leaderboard?by=" + encodeURIComponent(by));
        const body = $("#lbBody");
        if (!body) return;

        const medals = ["🥇", "🥈", "🥉"];

        body.innerHTML = asArray(list).length
          ? asArray(list).map((u, i) => `
            <div class="lb-row ${i < 3 ? "top" + (i + 1) : ""}" data-action="user" data-id="${esc(u.id)}">
              <div class="lb-pos">${medals[i] || i + 1}</div>
              <div class="lb-user">
                ${avatar(u, "md")}
                <span class="n">${esc(u.username)}</span>
                ${rankBadge(u.rank)}
              </div>
              <div class="lb-val ${by === "profit" ? (u.value >= 0 ? "positive" : "negative") : ""}">${GEM}${by === "profit" && u.value > 0 ? "+" : ""}${fmt(u.value)}</div>
            </div>`).join("")
          : '<div class="empty">No players yet</div>';
      } catch (error) { fail(error); }
    }

    /* ---------- Click router ---------- */
    const actions = {
      home() { closeModal(); closeModal2(); showPage("home"); },
      leaderboard() { showLeaderboard("totalBet"); },
      "lb-tab"(el) { loadLeaderboard(el.dataset.by); },
      event: openEvent,
      "event-join": joinEvent,
      "event-guess": submitGuess,
      close: closeModal,
      close2: closeModal2,
      login: showLogin,
      "login-start": loginStart,
      "login-verify": loginVerify,
      logout,

      "user-menu"() { $("#userMenu")?.classList.toggle("open"); },
      user(el) { showUserCard(el.dataset.id); },

      profile() { showProfile(1); },
      "profile-page"(el) { showProfile(Number(el.dataset.page)); },
      admin: openAdmin,

      wallet: showWallet,
      deposit: showDeposit,
      bots() { openBotsModal(); },
      "bot-join"() { window.open(BOT_LINK, "_blank", "noopener,noreferrer"); },
      withdraw,

      create: showCreate,
      "submit-create": submitCreate,

      side(el) {
        createSide = el.dataset.side;
        document.querySelectorAll("#sides .side-choice").forEach(s => s.classList.toggle("selected", s === el));
      },

      join(el) { closeModal(); showJoin(el.dataset.id); },
      "submit-join"(el) { submitJoin(el.dataset.id); },
      cancel(el) { cancelMatch(el.dataset.id); },
      view(el) { showView(el.dataset.id); },
      verify(el) { verifyMatch(el.dataset.id); },

      history: showHistory,
      replay(el) { startReplay(el.dataset.id); },
      "replay-again"(el) { startReplay(el.dataset.id); },
      "replay-back": showHistory,

      giveaway: showGiveaway,

      "giveaway-mode"(el) {
        giveawayMode = el.dataset.mode;
        document.querySelectorAll(".modal > .seg button").forEach(b => b.classList.toggle("on", b === el));
        renderGiveawayOptions();
      },

      "gw-dur"(el) {
        giveawayDur = Number(el.dataset.sec);
        renderGiveawayOptions();
      },

      "submit-giveaway": submitGiveaway,
      "enter-giveaway"(el) { enterGiveaway(el.dataset.id); },

      pick(el) { pickItem(el.dataset.id); },
      "select-all": selectAll,
      "select-none"() { selected.clear(); renderGrid(); },

      send: sendChat,
      emoji() { $("#emojiPop").classList.toggle("open"); },
      "emoji-pick"(el) {
        const input = $("#chatInput");
        input.value = (input.value + el.dataset.e).slice(0, 160);
        input.focus();
      }
    };

    document.addEventListener("click", event => {
      const el = event.target.closest("[data-action]");

      if (!event.target.closest(".user-menu-wrap")) $("#userMenu")?.classList.remove("open");

      if (!event.target.closest("#emojiPop") && !event.target.closest('[data-action="emoji"]')) {
        $("#emojiPop").classList.remove("open");
      }

      if (!el) return;

      const action = actions[el.dataset.action];

      if (action) {
        if (el.dataset.action !== "user-menu") $("#userMenu")?.classList.remove("open");
        action(el, event);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target && event.target.id === "guessInput") {
        submitGuess();
        return;
      }

      if (event.key !== "Escape") return;

      if ($("#overlay3").classList.contains("open") && confirmCancel) confirmCancel();
      else if ($("#overlay2").classList.contains("open")) closeModal2();
      else closeModal();
    });

    renderHeader();
    renderLobby();
    refresh();
  </script>
</body>
</html>
