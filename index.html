<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMP ROLL | The LEADING Adopt Me item coinflip</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2300efa0'/%3E%3Ccircle cx='50' cy='50' r='38' fill='%23101218'/%3E%3Cellipse cx='50' cy='62' rx='14' ry='11' fill='%2300efa0'/%3E%3Cellipse cx='33' cy='46' rx='6' ry='8' fill='%2300efa0'/%3E%3Cellipse cx='45' cy='36' rx='6' ry='8' fill='%2300efa0'/%3E%3Cellipse cx='57' cy='36' rx='6' ry='8' fill='%2300efa0'/%3E%3Cellipse cx='69' cy='46' rx='6' ry='8' fill='%2300efa0'/%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg: #101218; --header: #14161e; --panel: #191c25; --panel-2: #151820;
      --border: #292d38; --muted: #8d909a; --text: #f6f7fb;
      --green: #00efa0; --orange: #ffb52e; --red: #ff5968; --blue: #4da3ff;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--bg); color: var(--text);
      font-family: Inter, Arial, sans-serif; font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { color: var(--text); outline: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #343946; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app { display: flex; min-height: 100vh; flex-direction: column; }
    .gem-i { width: 1em; height: 1em; vertical-align: -.14em; margin-right: 3px; }
    .chip { width: 100%; height: 100%; display: block; }
    .muted { color: var(--muted); }
    .clickable { cursor: pointer; }

    /* ---------- HEADER ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 28px;
      height: 76px; padding: 0 25px; border-bottom: 1px solid var(--border); background: var(--header);
    }
    .logo {
      display: flex; align-items: center; gap: 10px; flex: none; cursor: pointer;
      font-size: 25px; font-weight: 800; letter-spacing: -1px; transition: transform .2s;
    }
    .logo:hover { transform: scale(1.03); }
    .logo svg { width: 38px; height: 38px; }
    .logo span { color: var(--green); }
    .nav { display: flex; flex: 1; align-items: center; height: 100%; gap: 8px; }
    .nav-item {
      display: flex; align-items: center; height: 100%; padding: 0 16px;
      border-bottom: 3px solid var(--green); cursor: pointer; font-weight: 700;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .wallet {
      display: flex; align-items: stretch; overflow: hidden; height: 44px;
      border-radius: 8px; background: #1b1e27; border: 1px solid var(--border);
    }
    .wallet-bal { display: flex; align-items: center; gap: 8px; padding: 0 16px; cursor: pointer; font-weight: 800; font-size: 15px; }
    .wallet-bal .gem-i { width: 22px; height: 22px; margin: 0; }
    .wallet-btn { padding: 0 20px; color: #04120b; background: var(--green); font-weight: 800; transition: filter .2s; }
    .wallet-btn:hover { filter: brightness(1.1); }
    .user-menu-wrap { position: relative; }
    .user-button {
      display: flex; align-items: center; gap: 10px; padding: 4px 10px; height: 44px;
      border-radius: 8px; color: var(--text); background: transparent; font-weight: 700; transition: background .2s;
    }
    .user-button:hover { background: #20232c; }
    .user-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; min-width: 200px; padding: 6px;
      border: 1px solid var(--border); border-radius: 8px; background: #20232c; box-shadow: 0 12px 30px #0008;
      opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .18s, transform .18s;
    }
    .user-menu.open { opacity: 1; transform: none; pointer-events: auto; }
    .user-menu button {
      display: block; width: 100%; padding: 11px; border-radius: 5px; color: var(--text);
      background: transparent; text-align: left; transition: background .15s;
    }
    .user-menu button:hover { background: #30343f; }

    /* ---------- AVATARS ---------- */
    .av {
      display: inline-grid; flex: none; place-items: center; width: 40px; height: 40px; overflow: hidden;
      border-radius: 50%; object-fit: cover; color: #fff; background: #3a4050; font-weight: 800;
      box-shadow: 0 0 0 2px #2c313c;
    }
    .av.sm { width: 29px; height: 29px; font-size: 11px; }
    .av.md { width: 44px; height: 44px; font-size: 16px; }
    .av.lg { width: 72px; height: 72px; font-size: 24px; }
    .av.xl { width: 118px; height: 118px; font-size: 38px; }
    .av.ring-green { box-shadow: 0 0 0 3px var(--green); }
    .av.ring-orange { box-shadow: 0 0 0 3px var(--orange); }
    .av.ring-dim { box-shadow: 0 0 0 2px #2c313c; }

    .pa { position: relative; display: inline-block; flex: none; }
    .pa .badge { position: absolute; left: -5px; bottom: -4px; width: 42%; height: 42%; }
    .pa.sm .badge { width: 50%; height: 50%; }
    .pa.xl .badge { width: 40%; height: 40%; left: 0; bottom: 2px; }

    /* ---------- BUTTONS ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 40px; padding: 0 17px; border-radius: 6px; color: #06130d; background: var(--green);
      font-weight: 800; transition: filter .2s, transform .12s, background .2s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn.sm { min-height: 32px; padding: 0 12px; font-size: 12px; }
    .btn.gray { border: 1px solid #414650; color: #d7d9e0; background: #292d37; }
    .btn.outline { border: 1px solid var(--green); color: var(--green); background: #17312c; }
    .btn.red { color: #fff; background: #d94453; }
    .btn.sun { color: #211500; background: var(--orange); }
    .btn.mint { color: #06130d; background: var(--green); }

    .eye {
      display: grid; place-items: center; width: 46px; height: 46px; border-radius: 7px;
      color: #fff; background: #292d37; transition: background .2s, transform .12s;
    }
    .eye:hover { background: #363b49; }
    .eye:active { transform: scale(.94); }
    .eye svg { width: 22px; height: 22px; }

    /* ---------- LAYOUT ---------- */
    .main {
      display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; width: 100%;
      max-width: 1700px; margin: 0 auto; padding: 18px; flex: 1;
    }
    .content { min-width: 0; }

    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
      margin-bottom: 14px; padding: 18px 20px; border: 1px solid #8f681d; border-radius: 7px;
      background: linear-gradient(100deg, #30271d, #211f22);
    }
    .banner h1 { margin: 0 0 5px; color: var(--orange); font-size: 20px; }
    .banner p { margin: 0; color: #bab4a5; font-size: 13px; }
    .banner .chips { display: flex; gap: 8px; }
    .banner .chips div { width: 46px; height: 46px; }

    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-bottom: 16px;
      overflow: hidden; border: 1px solid var(--border); border-radius: 7px; background: var(--border);
    }
    .summary div { padding: 15px; background: var(--panel); }
    .summary b { display: block; font-size: 19px; }
    .summary small { color: var(--muted); font-weight: 600; }

    .section-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-head h2 { flex: 1; margin: 0; font-size: 17px; }
    .pill { padding: 5px 9px; border-radius: 5px; color: var(--green); background: #15372d; font-size: 11px; font-weight: 800; }
    .card { border: 1px solid var(--border); border-radius: 7px; background: var(--panel); }

    /* ---------- ANIMATIONS ---------- */
    .enter { animation: enter .38s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } }

    /* ---------- ITEM GLOW ---------- */
    .gl { --gc: rgba(141, 144, 154, .35); border-color: var(--gc) !important; box-shadow: 0 0 14px -3px var(--gc), inset 0 0 16px -10px var(--gc); }
    .gl img { filter: drop-shadow(0 0 6px var(--gc)); }
    .gl-soft  { --gc: rgba(141, 144, 154, .45); }
    .gl-blue  { --gc: rgba(77, 163, 255, .75); }
    .gl-gold  { --gc: rgba(255, 181, 46, .85); }
    .gl-neon  { --gc: rgba(0, 239, 160, .85); }
    .gl-mega  { --gc: rgba(176, 94, 255, .9); }

    /* ---------- MATCHES ---------- */
    .match-list { display: flex; flex-direction: column; gap: 8px; }

    .match {
      display: grid; grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr);
      align-items: center; gap: 14px; min-height: 96px; padding: 14px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
      transition: border-color .25s, background .25s, transform .2s;
    }
    .match:hover { border-color: #3a4050; transform: translateY(-1px); }
    .match.finished { border-color: #715322; background: #24221f; }

    .m-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .m-right { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }

    .player { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .player.clickable:hover .player-name { color: var(--green); }
    .player-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; transition: color .15s; }

    .items { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
    .item-thumb {
      display: grid; place-items: center; width: 48px; height: 48px; overflow: hidden;
      border: 1px solid #353a45; border-radius: 6px; background: #222630; transition: transform .2s;
    }
    .item-thumb:hover { transform: translateY(-2px); }
    .item-thumb img { width: 100%; height: 100%; object-fit: contain; }

    /* centered middle column: countdown / coin / value */
    .match-middle { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; min-height: 64px; }
    .match-middle b { color: var(--green); }
    .match-middle small { display: block; color: var(--muted); font-size: 10px; }
    .match-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .empty { padding: 50px 15px; color: var(--muted); text-align: center; }

    /* ---------- COIN (3D, flips end-over-end with visible edge) ---------- */
    .coin-wrap { display: inline-block; perspective: 900px; }
    .coin-wrap.tossing { animation: toss .9s ease-in-out infinite; }
    .coin-wrap.hop { animation: hop-long 3.2s ease-out forwards; }
    .coin-wrap.hop-short { animation: hop-short 1.5s ease-out forwards; }
    .coin-wrap.shrunk { transform: scale(.62); }

    @keyframes toss { 50% { transform: translateY(-16px); } }
    @keyframes hop-long {
      0% { transform: translateY(0) scale(1); }
      22% { transform: translateY(-46px) scale(1.1); }
      72% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(.62); }
    }
    @keyframes hop-short {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-30px) scale(1.06); }
      80% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(.62); }
    }

    .coin { --s: 48px; position: relative; width: var(--s); height: var(--s); transform-style: preserve-3d; }
    .coin.big { --s: 170px; }
    .coin.cat { transform: rotateX(180deg); }
    .coin.spinning { animation: coin-spin .5s linear infinite; }
    .coin.land-dog { animation: land-dog 3.2s cubic-bezier(.12, .6, .15, 1) forwards; }
    .coin.land-cat { animation: land-cat 3.2s cubic-bezier(.12, .6, .15, 1) forwards; }
    .coin.settle-dog { animation: settle-dog 1.5s cubic-bezier(.15, .6, .2, 1) forwards; }
    .coin.settle-cat { animation: settle-cat 1.5s cubic-bezier(.15, .6, .2, 1) forwards; }

    .coin-face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      transform: translateZ(calc(var(--s) * .042));
    }
    .coin-face.back { transform: rotateX(180deg) translateZ(calc(var(--s) * .042)); }
    .coin-edge {
      position: absolute; inset: 0; border-radius: 50%; background: #f1ecda;
      transform: translateZ(calc(var(--s) * var(--k) * .0115));
    }
    .coin-edge:nth-child(even) { background: #cdc6ae; }
    .coin .chip { filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .45)); }

    @keyframes coin-spin { to { transform: rotateX(360deg); } }
    @keyframes land-dog { from { transform: rotateX(0); } to { transform: rotateX(2160deg); } }
    @keyframes land-cat { from { transform: rotateX(0); } to { transform: rotateX(2340deg); } }
    @keyframes settle-dog { from { transform: rotateX(0); } to { transform: rotateX(1080deg); } }
    @keyframes settle-cat { from { transform: rotateX(0); } to { transform: rotateX(1260deg); } }

    .coin-stage { position: relative; display: inline-block; }
    .count-over {
      position: absolute; inset: 0; display: grid; place-items: center; color: #fff;
      font-size: 64px; font-weight: 800; text-shadow: 0 4px 18px #000;
    }
    .countdown {
      display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto;
      border: 3px solid var(--orange); border-radius: 50%; color: var(--orange);
      font-size: 24px; font-weight: 800; animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.12); } }

    /* view modal: only the number during the countdown */
    .big-count {
      color: #fff; font-size: 110px; font-weight: 800; line-height: 1;
      text-shadow: 0 6px 30px rgba(0, 0, 0, .7); animation: pulse 1s ease-in-out infinite;
    }

    /* avatar rings (winner ring draws itself) */
    .ring-wrap { position: relative; display: inline-block; padding: 0; border-radius: 50%; }
    .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .ring-svg circle { fill: none; }
    .ring-svg .r-win { stroke: var(--green); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 296; stroke-dashoffset: 0; filter: drop-shadow(0 0 6px rgba(0, 239, 160, .7)); }
    .ring-svg .r-win.anim { stroke-dashoffset: 296; animation: ringdraw 1.1s ease-out forwards; }
    @keyframes ringdraw { to { stroke-dashoffset: 0; } }

    /* ---------- SIDEBAR / CHAT ---------- */
    .sidebar {
      position: sticky; top: 94px; display: flex; flex-direction: column; gap: 10px;
      height: calc(100vh - 112px); min-height: 420px;
    }

    .giveaways { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
    .giveaway-card {
      position: relative; display: flex; align-items: center; gap: 12px; padding: 12px;
      border: 1px solid #6a5528; border-radius: 8px; overflow: hidden;
      background: linear-gradient(100deg, #3a2f1c, #1f1e22 80%);
    }
    .giveaway-card::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--orange);
    }
    .gw-img {
      display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 8px;
      background: #1c1d22; border: 1px solid #4a3d22;
    }
    .gw-img img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(255, 181, 46, .6)); }
    .giveaway-info { flex: 1; min-width: 0; color: #cfc6b0; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .giveaway-info b { color: #fff; font-size: 13px; }
    .gw-time { color: var(--orange); font-weight: 800; }

    .chat {
      display: flex; flex: 1; flex-direction: column; min-height: 0; overflow: hidden;
      border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
    }
    .chat-head {
      display: flex; align-items: center; justify-content: space-between; padding: 15px 16px;
      border-bottom: 1px solid var(--border); font-weight: 800;
    }
    .online { color: var(--green); font-size: 12px; }

    .messages { display: flex; flex: 1; flex-direction: column; gap: 4px; overflow-y: auto; padding: 10px 14px; scroll-behavior: smooth; }

    .message { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
    .message .av { box-shadow: 0 0 0 2px #2c313c; }
    .message .who { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
    .message .uname { font-size: 15px; font-weight: 800; color: #fff; cursor: pointer; }
    .message .uname:hover { text-decoration: underline; }
    .message .txt { color: #a3a6b0; font-size: 14px; font-weight: 500; }
    .message .ava-click { cursor: pointer; }

    .uname.r-Roller { color: var(--blue); }
    .uname.r-Highroller { color: var(--red); }
    .uname.r-Whale { color: var(--orange); }
    .uname.r-ADMIN { color: var(--red); }

    .rank-badge { width: 20px; height: 20px; flex: none; }
    .rank-badge.r-Roller { color: var(--blue); }
    .rank-badge.r-Highroller { color: var(--red); }
    .rank-badge.r-Whale { color: var(--orange); }

    .tag-admin { padding: 1px 6px; border-radius: 4px; color: #fff; background: #d94453; font-size: 10px; font-weight: 800; }

    .chat-input { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
    .chat-input .field { position: relative; }
    .chat-input input {
      width: 100%; padding: 15px 44px 15px 16px; border: 0; border-radius: 8px;
      background: #2a2d38; font-weight: 600; font-size: 14px;
    }
    .chat-input input::placeholder { color: #8d909a; }
    .chat-input .emoji-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; padding: 0; color: #a3a6b0; background: transparent; font-size: 20px; line-height: 1;
    }
    .chat-input .emoji-btn:hover { color: #fff; }
    .send-btn { padding: 14px; border-radius: 8px; color: #fff; background: #2d313d; font-weight: 800; transition: background .2s; }
    .send-btn:hover { background: #383d4b; }

    .emoji-pop {
      position: absolute; right: 12px; bottom: 74px; z-index: 5; display: none; flex-wrap: wrap; gap: 4px;
      width: 220px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #20232c; box-shadow: 0 10px 25px #0009;
    }
    .emoji-pop.open { display: flex; }
    .emoji-pop button { width: 34px; height: 34px; border-radius: 6px; background: transparent; font-size: 20px; }
    .emoji-pop button:hover { background: #30343f; }

    /* ---------- MODALS ---------- */
    .ov {
      position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 18px; background: rgba(0, 0, 0, .76);
    }
    .ov.top { z-index: 110; background: rgba(0, 0, 0, .55); }
    .ov.open { display: flex; animation: fade .2s ease both; }

    .modal {
      width: min(560px, 100%); max-height: 92vh; overflow: auto; padding: 18px;
      border: 1px solid #292d37; border-radius: 8px; background: #14171f;
      box-shadow: 0 20px 70px #000a; animation: pop .25s cubic-bezier(.2, .8, .2, 1) both;
    }
    .modal.wide { width: min(1024px, 100%); }
    .modal.view { width: min(900px, 100%); }
    .modal.small { width: min(640px, 100%); }
    .modal.card-user { width: min(440px, 100%); padding: 22px; }

    .mh { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .mh h3 { flex: 1; margin: 0; font-size: 18px; }
    .x { width: 30px; height: 30px; color: #a4a6ae; background: transparent; font-size: 24px; transition: color .2s; }
    .x:hover { color: #fff; }
    .hint { margin: 7px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }

    .in, .row input:not([type="checkbox"]), .row select, .control {
      min-width: 0; padding: 12px; border: 2px solid #484b54; border-radius: 7px;
      color: var(--text); background: #14171f; transition: border-color .2s;
    }
    .in:focus, .row input:focus, .control:focus { border-color: var(--green); }
    .row input[type="text"] { flex: 1; }

    .inventory-tools { display: grid; grid-template-columns: minmax(150px, 2fr) minmax(130px, .9fr) minmax(140px, .9fr); gap: 8px; margin-bottom: 15px; }
    .inventory-box { min-height: 370px; padding: 16px; border-radius: 7px; background: #191c25; }
    .inventory-summary { display: flex; align-items: center; gap: 24px; margin-bottom: 15px; }
    .inventory-summary small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }
    .inventory-summary b { font-size: 18px; }
    .inventory-summary .big-gem { width: 34px; height: 34px; }
    .inventory-plus { width: 32px; height: 32px; border-radius: 6px; color: #04120b; background: var(--green); font-size: 19px; font-weight: 800; transition: filter .2s; }
    .inventory-plus:hover { filter: brightness(1.1); }
    .inventory-empty { display: flex; min-height: 260px; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .inventory-empty h2 { margin: 0 0 10px; font-size: 28px; }
    .inventory-empty p { margin: 0 0 24px; color: #bfc1c9; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 8px; max-height: 390px; overflow-y: auto; padding: 4px; }
    .inventory-item {
      position: relative; min-height: 150px; padding: 8px; border: 2px solid #30343e; border-radius: 6px;
      background: #20242e; text-align: center; cursor: pointer; transition: border-color .2s, background .2s, transform .15s;
    }
    .inventory-item:hover { transform: translateY(-2px); }
    .inventory-item.selected { border-color: var(--green) !important; background: #19372f; }
    .inventory-item img { width: 75px; height: 75px; object-fit: contain; }
    .inventory-item .name { height: 30px; overflow: hidden; font-size: 11px; font-weight: 700; }
    .inventory-item .value { margin-top: 4px; color: var(--green); font-size: 12px; font-weight: 800; }
    .check { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 4px; color: #07120d; background: var(--green); font-weight: 800; }

    .tg { display: flex; justify-content: center; gap: 3px; margin-top: 3px; }
    .tg i { padding: 1px 5px; border-radius: 3px; color: #fff; font-size: 9px; font-style: normal; font-weight: 800; }
    .tg .M { background: #a855f7; }
    .tg .N { background: #22c55e; color: #04230f; }
    .tg .F { background: #3b82f6; }
    .tg .R { background: #ef4444; }

    .modal-footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .sides { display: flex; gap: 10px; margin-bottom: 14px; }
    .side-choice {
      display: grid; place-items: center; flex: 1; padding: 14px; border: 2px solid #343842; border-radius: 8px;
      background: #20242e; cursor: pointer; transition: border-color .2s, background .2s, transform .15s;
    }
    .side-choice:hover { transform: translateY(-2px); }
    .side-choice.selected { border-color: var(--green); background: #19372f; }
    .side-choice div { width: 70px; height: 70px; }

    /* ---------- VIEW MATCH ---------- */
    .vw-top { position: relative; display: flex; align-items: center; justify-content: center; min-height: 34px; margin-bottom: 14px; }
    .vw-top .x { position: absolute; right: 0; top: 2px; }
    .vw-top .status { position: absolute; left: 0; top: 4px; }
    .view-logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
    .view-logo svg { width: 30px; height: 30px; }
    .view-logo span { color: var(--green); }

    .status { padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .6px; }
    .status.wait { color: var(--orange); background: #3a2d14; }
    .status.count { color: #ffd35a; background: #3a3214; }
    .status.flip { color: var(--blue); background: #14283d; }
    .status.done { color: var(--green); background: #15372d; }
    .status.replay { color: #c9a6ff; background: #2b1d3f; }

    .vw-pot { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 4px; }
    .vw-pot small { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .vw-pot b { font-size: 32px; color: var(--green); text-shadow: 0 0 24px rgba(0, 239, 160, .35); }

    .vw-arena { display: grid; grid-template-columns: 1fr minmax(180px, 1fr) 1fr; gap: 12px; align-items: center; margin: 10px 0 14px; }
    .vw-player { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; padding: 6px; transition: opacity .4s; }
    .vw-player.lose { opacity: .45; }
    .vw-name { display: flex; align-items: center; gap: 6px; max-width: 100%; font-size: 15px; font-weight: 800; }
    .vw-name span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vw-host { padding: 2px 6px; border-radius: 4px; color: var(--orange); background: #3a2d14; font-size: 9px; font-weight: 800; }
    .vw-bet { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
    .vp-wait { display: grid; place-items: center; width: 118px; height: 118px; border-radius: 50%; border: 2px dashed #3a3f4c; color: var(--muted); font-size: 30px; font-weight: 800; }

    .vw-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 220px; }
    .vs-text { font-size: 18px; font-weight: 800; color: var(--muted); letter-spacing: 3px; }
    .vw-range { padding: 7px 12px; border-radius: 6px; background: #1b1e27; color: #bfc1c9; font-size: 12px; font-weight: 700; text-align: center; }
    .winner-text { font-size: 18px; font-weight: 800; color: var(--green); text-align: center; animation: enter .4s both; }
    .winner-text small { display: block; margin-top: 3px; color: #a6aab5; font-size: 12px; font-weight: 700; }

    .view-hash { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0 14px; color: #a2a6b3; font-size: 12px; }
    .view-hash b { color: #fff; }

    .vw-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
    .vw-col h4 { display: flex; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 11px; letter-spacing: .7px; text-transform: uppercase; }
    .vw-col h4 span { color: #fff; }
    .vlist { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px; }
    .irow { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border: 1px solid #2c303b; border-radius: 8px; background: #191c25; animation: enter .4s both; }
    .irow img { width: 54px; height: 54px; object-fit: contain; }
    .iname { flex: 1; min-width: 0; font-weight: 700; }
    .iname .tg { display: inline-flex; margin: 0 0 0 6px; }
    .fair { margin-top: 14px; padding: 12px; border-radius: 6px; color: #a6aab5; background: #1b1e27; font-size: 11px; line-height: 1.7; overflow-wrap: anywhere; }
    .fair code { color: #e5e7ec; }

    .seg { display: flex; gap: 5px; margin-bottom: 12px; }
    .seg button { flex: 1; padding: 10px; border-radius: 5px; color: #b6b8c0; background: #242832; font-weight: 700; transition: background .2s; }
    .seg button.on { color: #07120d; background: var(--green); }

    /* giveaway modal */
    .gw-box { padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px; background: #191c25; }
    .gw-box label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .gw-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .gw-fields input { width: 100%; padding: 12px; border: 2px solid #484b54; border-radius: 7px; background: #14171f; }
    .gw-fields input:focus { border-color: var(--green); }

    /* ---------- HISTORY ---------- */
    .hrow {
      display: grid; grid-template-columns: 130px minmax(0, 1fr) 60px 50px; align-items: center; gap: 12px;
      margin-bottom: 8px; padding: 12px 16px; border: 1px solid #292d38; border-radius: 6px; background: #191c25; transition: background .2s;
    }
    .hrow:hover { background: #1e222c; }
    .hplayers { display: flex; align-items: center; gap: 12px; }
    .hitems { display: flex; align-items: center; padding-left: 10px; }
    .hitems .ci {
      display: grid; place-items: center; width: 48px; height: 48px; margin-left: -10px; overflow: hidden;
      border: 2px solid #14171f; border-radius: 50%; background: #20242e; font-weight: 800; font-size: 12px; color: #aab;
    }
    .hitems .ci img { width: 100%; height: 100%; object-fit: contain; }
    .hwin { width: 46px; height: 46px; }

    /* ---------- DEPOSIT / BOTS ---------- */
    .game-card {
      position: relative; display: grid; place-items: center; width: 100%; max-width: 360px; aspect-ratio: 16 / 9; overflow: hidden;
      border: 1px solid #7a1f4a; border-radius: 10px; cursor: pointer;
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 130, 180, .55), transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(110, 0, 50, .5), transparent 50%),
        linear-gradient(135deg, #e8296f, #b5155a);
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .game-card:hover { transform: translateY(-3px); border-color: #ff7aa8; box-shadow: 0 10px 28px -8px rgba(255, 60, 120, .6); }
    .adopt-logo {
      font-family: Fredoka, "Baloo 2", "Arial Rounded MT Bold", Arial, sans-serif; font-weight: 700;
      font-size: clamp(36px, 9vw, 62px); line-height: 1; letter-spacing: -1px; color: #fff; text-align: center;
      text-shadow: 0 4px 0 rgba(120, 0, 50, .35), 0 10px 26px rgba(0, 0, 0, .28);
      -webkit-text-stroke: 1px rgba(255, 255, 255, .2); pointer-events: none; user-select: none;
    }

    .warn {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 13px 16px;
      border: 1px solid #a8741a; border-radius: 8px; background: #2b241d; color: #ffc65a; font-weight: 700; font-size: 13px; line-height: 1.5;
    }
    .warn i { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; color: #1a1100; background: var(--orange); font-style: normal; font-weight: 800; }

    .bot-row { display: flex; align-items: stretch; overflow: hidden; margin-bottom: 8px; border: 1px solid #2c303b; border-radius: 8px; background: #191c25; }
    .bot-main { display: flex; flex: 1; align-items: center; gap: 12px; padding: 10px 14px; font-weight: 700; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #0fbf7c; box-shadow: 0 0 8px #0fbf7c; }
    .bot-row .join { min-width: 76px; color: #04120b; background: var(--green); font-weight: 800; transition: filter .2s; }
    .bot-row .join:hover { filter: brightness(1.1); }

    .code { margin: 14px 0; padding: 16px; border: 1px dashed var(--green); border-radius: 6px; color: var(--green); background: #172a24; text-align: center; font-size: 18px; font-weight: 800; user-select: all; line-height: 1.5; }

    .success { text-align: center; padding: 10px 6px 4px; }
    .success .tick { display: grid; place-items: center; width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 50%; color: #04120b; background: var(--green); font-size: 38px; font-weight: 800; box-shadow: 0 0 30px -4px var(--green); animation: pop .4s both; }
    .success h2 { margin: 0 0 8px; }
    .success p { margin: 0 0 18px; color: #bfc1c9; line-height: 1.6; }

    /* ---------- USER CARD ---------- */
    .uc-head { position: relative; display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
    .uc-head .x { position: absolute; right: -6px; top: -10px; }
    .uc-name { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
    .uc-rank { display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .uc-rank.r-Roller { color: var(--blue); }
    .uc-rank.r-Highroller { color: var(--red); }
    .uc-rank.r-Whale { color: var(--orange); }
    .uc-rank.r-Rookie { color: var(--muted); }
    .uc-game { margin-bottom: 8px; padding: 13px; border-radius: 6px; background: #242832; text-align: center; font-weight: 800; letter-spacing: .3px; }
    .uc-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--border); gap: 1px; }
    .uc-stat { padding: 16px; background: #171a22; }
    .uc-stat b { display: flex; align-items: center; gap: 4px; font-size: 18px; }
    .uc-stat small { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }

    /* ---------- PROFILE ---------- */
    .profile-card { padding: 18px; }
    .profile-head { display: flex; align-items: center; gap: 15px; }
    .profile-head h2 { margin: 0 0 6px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0; }
    .stat { padding: 16px; border: 1px solid var(--border); border-radius: 6px; background: #20242e; }
    .stat small { display: block; margin-bottom: 8px; color: var(--muted); }
    .stat b { font-size: 20px; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 11px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); }
    .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 14px; }
    .pagination button { min-width: 34px; height: 34px; border-radius: 5px; color: #fff; background: #30343e; }
    .pagination button.on { color: #06130d; background: var(--green); }

    /* ---------- TOASTS / BOOT ---------- */
    .toasts { position: fixed; top: 88px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast { max-width: 320px; padding: 12px 15px; border: 1px solid #444; border-radius: 6px; color: #fff; background: #252a34; box-shadow: 0 8px 25px #0008; animation: enter .3s both; }
    .toast.err { background: #9e303d; }
    .toast.ok { color: #04120b; background: var(--green); }

    #boot { position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px; background: #11141b; text-align: center; font-weight: 700; }
    .loader { width: 42px; height: 42px; border: 4px solid #323844; border-top-color: var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ov.top3 { z-index: 250; background: rgba(0, 0, 0, .62); }
    .check-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; padding: 12px; border-radius: 8px; background: #191c25; font-weight: 700; cursor: pointer; }
    .check-row input { width: 18px; height: 18px; accent-color: var(--green); }

    .chat-event-btn { margin-top: 6px; }

    .event-strip {
      display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding: 14px 18px;
      border: 1px solid var(--orange); border-radius: 8px;
      background: linear-gradient(100deg, #3a2d14, #1f1e22); box-shadow: 0 0 26px -10px rgba(255, 181, 46, .6);
    }
    .event-strip .ev-ico { font-size: 34px; }
    .event-strip .ev-text { flex: 1; min-width: 0; line-height: 1.5; }
    .event-strip small { color: #d6caa8; font-size: 12px; }
    .event-strip b.ticker-giveaway { color: var(--orange); }

    .ev-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
    .ev-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .ev-head h2 { flex: 1; margin: 0; }
    .ev-prize { display: inline-flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #4a3d22; border-radius: 8px; background: #20222a; }
    .ev-prize img { width: 54px; height: 54px; object-fit: contain; }
    .ev-prize span { display: block; color: var(--green); font-weight: 800; }
    .ev-status { margin: 14px 0; font-size: 16px; font-weight: 800; text-align: center; min-height: 24px; }
    .ev-status b { color: var(--orange); }
    .ev-center { display: flex; flex-direction: column; align-items: center; }
    .ev-list { display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow-y: auto; }
    .ev-list h4 { margin: 8px 0 2px; color: var(--muted); font-size: 11px; letter-spacing: .7px; text-transform: uppercase; }
    .ev-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #2c303b; border-radius: 8px; background: #191c25; font-weight: 700; transition: opacity .4s; }
    .ev-row.out { opacity: .4; text-decoration: line-through; }
    .ev-row.win { border-color: var(--green); background: #15332a; }
    .ev-winner { margin-top: 14px; padding: 18px; border: 1px solid var(--green); border-radius: 10px; background: #15332a; text-align: center; font-size: 18px; font-weight: 800; animation: enter .4s both; }
    .ev-winner .ev-prize { margin-top: 12px; text-align: left; }

    .wheel-box { position: relative; width: min(340px, 86vw); aspect-ratio: 1; margin: 6px auto; }
    .wheel-rot { width: 100%; height: 100%; }
    .wheel-rot svg { width: 100%; height: 100%; display: block; }
    .wheel-rot.idle { animation: wspin 40s linear infinite; }
    .wheel-rot.fast { animation: wspin .9s linear infinite; }
    @keyframes wspin { to { transform: rotate(360deg); } }
    .wheel-pointer {
      position: absolute; top: -10px; left: 50%; z-index: 2; width: 0; height: 0; transform: translateX(-50%);
      border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid #fff;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .7));
    }
    .wheel-empty { display: grid; place-items: center; width: 100%; height: 100%; border: 3px dashed #3a3f4c; border-radius: 50%; color: var(--muted); font-weight: 800; text-align: center; padding: 20px; }

    .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 24px 0; }
    .tile {
      display: grid; place-items: center; width: 56px; height: 64px; border: 2px solid #4a3d22; border-radius: 10px;
      background: linear-gradient(180deg, #2b2418, #1b1d24); color: var(--orange); font-size: 30px; font-weight: 800;
      box-shadow: 0 6px 18px -8px rgba(255, 181, 46, .5);
    }
    .guess-row { display: flex; gap: 8px; max-width: 460px; margin: 0 auto; }
    .guess-row input { flex: 1; text-transform: lowercase; }

    @media (max-width: 1050px) { .ev-grid { grid-template-columns: 1fr; } }

    .nav-item.alt { border-bottom-color: transparent; color: #cfd2db; transition: color .2s, border-color .2s; }
    .nav-item.alt:hover { color: #fff; border-bottom-color: var(--green); }

    .lb-row {
      display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
      margin-bottom: 8px; padding: 10px 14px; border: 1px solid #292d38; border-radius: 8px;
      background: #191c25; cursor: pointer; transition: background .2s, transform .15s;
    }
    .lb-row:hover { background: #1e222c; transform: translateY(-1px); }
    .lb-row.top1 { border-color: #a8741a; background: linear-gradient(100deg, #2b241d, #191c25); }
    .lb-row.top2 { border-color: #6b7280; }
    .lb-row.top3 { border-color: #8a5a2b; }
    .lb-pos { font-size: 20px; font-weight: 800; text-align: center; color: var(--muted); }
    .lb-user { display: flex; align-items: center; gap: 12px; min-width: 0; font-weight: 800; }
    .lb-user span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-val { display: flex; align-items: center; font-weight: 800; font-size: 16px; }

    .discord-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px;
      color: #fff; background: #5865f2; font-weight: 800; text-decoration: none; transition: filter .2s, transform .12s;
    }
    .discord-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .discord-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .banner.announce { border-color: var(--green); background: linear-gradient(100deg, #12332a, #1b2420); box-shadow: 0 0 26px -10px rgba(0, 239, 160, .5); }
    .banner.announce h1 { color: var(--green); }
    .banner.announce p { color: #d5e6df; font-size: 14px; }

    #adm .modal { color: var(--text); background: #14171f; }
    #adm [style*="background:#f5faff"] { background: #20242e !important; }
    #adm [style*="border:2px solid #e0edfb"] { border-color: #343842 !important; }
    #adm [style*="border-bottom:1px solid #e0edfb"] { border-color: #343842 !important; }

    @media (max-width: 1050px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { position: static; height: 520px; order: 2; }
      .match { grid-template-columns: 1fr; }
      .match-actions { justify-content: flex-start; }
      .m-right { flex-wrap: wrap; }
    }

    @media (max-width: 650px) {
      .topbar { flex-wrap: wrap; height: auto; min-height: 70px; gap: 8px; padding: 10px; }
      .logo { font-size: 21px; }
      .nav { display: none; }
      .header-right { margin-left: auto; }
      .user-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
      .main { padding: 10px; }
      .summary { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .inventory-tools { grid-template-columns: 1fr; }
      .vw-arena { grid-template-columns: 1fr; }
      .vw-lists { grid-template-columns: 1fr; }
      .discord-btn span { display: none; }
      .gw-fields { grid-template-columns: 1fr; }
      .hrow { grid-template-columns: 1fr 50px; }
      .hitems { grid-column: 1 / -1; order: 3; }
      .coin.big { --s: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

      <radialGradient id="gOrangeIn" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffbf3f"/><stop offset="1" stop-color="#e57800"/></radialGradient>
      <radialGradient id="gGreen" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#5dffc4"/><stop offset="1" stop-color="#00a870"/></radialGradient>
      <radialGradient id="gGreenIn" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#2ff5ae"/><stop offset="1" stop-color="#009463"/></radialGradient>

  <script>
    "use strict";

    const API_BASE = window.location.origin;
    const BOT_NAME = "DedokAmp";
    const BOT_LINK = "https://www.roblox.com/share?code=a0dd8a7bc68f034b99e078f454d4e903&type=Server";

    /* ---------- Coin designs ---------- */
    (function buildSymbols() {
      const notches = color => Array.from({ length: 8 }, (_, i) =>
        `<rect x="43" y="3" width="14" height="10" rx="3" fill="${color}" transform="rotate(${i * 45} 50 50)"/>`
      ).join("");

      const paw = `
        <g fill="#fffaf0">
          <ellipse cx="50" cy="60" rx="13" ry="10"/>
          <ellipse cx="35" cy="46" rx="5" ry="6.5" transform="rotate(-25 35 46)"/>
          <ellipse cx="44" cy="37" rx="5" ry="7"/>
          <ellipse cx="56" cy="37" rx="5" ry="7"/>
          <ellipse cx="65" cy="46" rx="5" ry="6.5" transform="rotate(25 65 46)"/>
        </g>`;

      const cat = `
        <g fill="#f4fff9">
          <polygon points="32,48 33,27 47,39"/>
          <polygon points="68,48 67,27 53,39"/>
          <ellipse cx="50" cy="55" rx="19" ry="16"/>
        </g>
        <g fill="#00835a">
          <circle cx="43" cy="53" r="2.8"/><circle cx="57" cy="53" r="2.8"/>
          <polygon points="47,59 53,59 50,63"/>
        </g>
        <g stroke="#00835a" stroke-width="1.2" stroke-linecap="round">
          <line x1="30" y1="58" x2="40" y2="59"/><line x1="30" y1="63" x2="40" y2="61"/>
          <line x1="70" y1="58" x2="60" y2="59"/><line x1="70" y1="63" x2="60" y2="61"/>
        </g>`;

      document.getElementById("symbols").insertAdjacentHTML("beforeend", `
        <symbol id="chip-dog" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="url(#gOrange)" stroke="#b45f00" stroke-width="2"/>
          ${notches("#fff3d1")}
          <circle cx="50" cy="50" r="33" fill="url(#gOrangeIn)" stroke="#fff3d1" stroke-width="3"/>
          ${paw}
        </symbol>
        <symbol id="chip-cat" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="url(#gGreen)" stroke="#007a52" stroke-width="2"/>
          ${notches("#e6fff5")}
          <circle cx="50" cy="50" r="33" fill="url(#gGreenIn)" stroke="#e6fff5" stroke-width="3"/>
          ${cat}
        </symbol>
      `);
    })();

    const GEM = '<svg class="gem-i" viewBox="0 0 24 24"><use href="#gem"/></svg>';
    const chip = (side, cls = "") =>
      `<svg class="chip ${cls}" viewBox="0 0 100 100"><use href="#chip-${side === "cat" ? "cat" : "dog"}"/></svg>`;
    const EYE = '<svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.5 9 1 12c1.5 3 5.5 7 11 7s9.5-4 11-7c-1.5-3-5.5-7-11-7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>';
    const LOGO_MARK = '<svg viewBox="0 0 100 100"><use href="#logo-mark"/></svg>';

    const rankBadge = rank => (rank && rank !== "Rookie" && rank !== "ADMIN")
      ? `<svg class="rank-badge r-${esc(rank)}" viewBox="0 0 24 24"><use href="#rank-badge"/></svg>` : "";

    /* ---------- Utilities ---------- */
    const $ = selector => document.querySelector(selector);

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);

    const fmt = value => Number(value || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });

    function short(n) {
      n = Number(n || 0);
      if (n >= 1e6) return Number((n / 1e6).toFixed(2)) + "M";
      if (n >= 1e3) return Number((n / 1e3).toFixed(1)) + "K";
      return fmt(n);
    }

    const asArray = v => Array.isArray(v) ? v : [];

    const getUsername = user => {
      if (!user) return "";
      if (typeof user === "string") return user;
      return user.username || user.name || "";
    };

    let token = localStorage.getItem("amp_token") || "";
    let ME = null;
    let STATE = { matches: [], giveaways: [], chat: [], bot: null, online: 0, config: { range: 0.10 } };

    let socket = null, booted = false, refreshing = false, refreshTimer = null;
    let selected = new Set(), gridContext = null, gridSig = "";
    let viewMatchId = null, viewSig = "", viewCache = null, viewPrev = "", viewTimer = null;
    let loginData = null, createSide = "dog";
    let giveawayMode = "easy", giveawayDur = 30;

    let HISTORY = [], REPLAY = null, replayTimers = [];

    const seenMatches = new Set(), seenChat = new Set();
    let headerSig = "", lobbySig = "", chatSig = "", gwSig = "";

    /* ---------- API ---------- */
    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;

      const response = await fetch(API_BASE + path, {
        method: options.method || (options.body ? "POST" : "GET"),
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }

      if (!response.ok) {
        const error = new Error(data.error || data.message || `HTTP ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function toast(message, type = "") {
      const el = document.createElement("div");
      el.className = "toast " + type;
      el.textContent = message;
      $("#toasts").appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    const fail = error => toast(error.message || String(error), "err");

    /* ---------- Helpers ---------- */
    function avatar(user, size = "", ring = "") {
      const name = getUsername(user) || "?";
      const image = user && (user.avatar || user.avatarUrl);
      if (image) return `<img class="av ${size} ${ring}" src="${esc(image)}" alt="">`;
      return `<span class="av ${size} ${ring}">${esc(name.charAt(0).toUpperCase())}</span>`;
    }

    function playerAvatar(user, side, size = "", ring = "") {
      return `<span class="pa ${size}">${avatar(user, size, ring)}<span class="badge">${chip(side)}</span></span>`;
    }

    function tags(item) {
      let r = "";
      if (item.age === "mega" || item.mega) r += '<i class="M">M</i>';
      if (item.age === "neon" || item.neon) r += '<i class="N">N</i>';
      if (item.fly) r += '<i class="F">F</i>';
      if (item.ride) r += '<i class="R">R</i>';
      return r ? `<div class="tg">${r}</div>` : "";
    }

    /* soft glow by rarity: mega purple, neon green, otherwise by value */
    function glow(item) {
      if (item.age === "mega" || item.mega) return "gl gl-mega";
      if (item.age === "neon" || item.neon) return "gl gl-neon";
      const v = Number(item.value || 0);
      if (v >= 500) return "gl gl-gold";
      if (v >= 50) return "gl gl-blue";
      return "gl gl-soft";
    }

    const itemId = item => String(item.uid || item.id || item.catalogId || "");
    const itemImage = item => item.image || item.imageUrl || "";
    const inventory = () => ME ? asArray(ME.inventory) : [];
    const totalValue = items => items.reduce((t, i) => t + Number(i.value || 0), 0);
    const selectedItems = () => inventory().filter(i => selected.has(itemId(i)));
    const selectedUids = () => selectedItems().map(itemId);

    function matchRange(value) {
      const t = Number(STATE.config?.range ?? 0.10);
      return [value * (1 - t), value * (1 + t)];
    }

    function thumbs(items, max = 6) {
      const arr = asArray(items);
      let html = arr.slice(0, max).map(i => `
        <div class="item-thumb ${glow(i)}" title="${esc(i.name)} • ${fmt(i.value)}">
          <img src="${esc(itemImage(i))}" alt="">
        </div>`).join("");
      if (arr.length > max) html += `<div class="item-thumb"><b>+${arr.length - max}</b></div>`;
      return html;
    }

    function wagerBarHTML() {
      const w = Number(ME && ME.wagerLeft || 0);
      if (w <= 0.001) return "";
      return `<div class="warn"><i>!</i><span>Wager requirement: you must wager <b>${GEM}${fmt(w)}</b> more in coinflips before you can withdraw items you received from giveaways or admins.</span></div>`;
    }

    function requireLogin() {
      if (ME) return true;
      showLogin();
      return false;
    }

    $("#bannerChips").innerHTML = `<div>${chip("dog")}</div><div>${chip("cat")}</div>`;

    /* ---------- Modals ---------- */
    const modalHeader = (title, closeAction = "close") => `
      <div class="mh"><h3>${title}</h3><button class="x" data-action="${closeAction}">×</button></div>`;

    function openModal(html, kind = "") {
      $("#modal").className = "modal " + kind;
      $("#modal").innerHTML = html;
      gridSig = "";
      $("#overlay").classList.add("open");
    }

    function clearReplay() {
      replayTimers.forEach(clearTimeout);
      replayTimers = [];
      REPLAY = null;
    }

    function closeModal() {
      $("#overlay").classList.remove("open");
      selected.clear();
      gridContext = null;
      viewMatchId = null;
      viewSig = "";
      viewCache = null;
      viewPrev = "";
      clearTimeout(viewTimer);
      clearReplay();
    }

    function openModal2(html, kind = "small") {
      $("#modal2").className = "modal " + kind;
      $("#modal2").innerHTML = html;
      $("#overlay2").classList.add("open");
    }

    function closeModal2() { $("#overlay2").classList.remove("open"); }

    $("#overlay").addEventListener("mousedown", e => { if (e.target.id === "overlay") closeModal(); });
    $("#overlay2").addEventListener("mousedown", e => { if (e.target.id === "overlay2") closeModal2(); });

    /* ---------- Header ---------- */
    function renderHeader() {
      const inv = inventory();
      const sig = JSON.stringify(ME ? [ME.id, ME.username, ME.avatar, ME.isAdmin, inv.length, totalValue(inv)] : null);
      if (sig === headerSig) return;
      headerSig = sig;

      const target = $("#headerRight");

      if (!ME) {
        target.innerHTML = `<button class="btn" data-action="login">Login with Roblox</button>`;
        return;
      }

      const menuOpen = $("#userMenu") && $("#userMenu").classList.contains("open");

      target.innerHTML = `
        <div class="wallet">
          <div class="wallet-bal" data-action="wallet">${GEM}<span>${fmt(totalValue(inv))}</span></div>
          <button class="wallet-btn" data-action="wallet">Wallet</button>
        </div>

        <div class="user-menu-wrap">
          <button class="user-button" data-action="user-menu">
            ${avatar(ME, "sm")}
            <span class="user-name">${esc(ME.username)}</span>
          </button>

          <div class="user-menu ${menuOpen ? "open" : ""}" id="userMenu">
            <button data-action="profile">👤 Profile</button>
            <button data-action="giveaway">🎁 Create Giveaway</button>
            ${ME.isAdmin ? '<button data-action="admin">🛠 Admin Panel</button>' : ""}
            <button data-action="logout">🚪 Logout</button>
          </div>
        </div>`;
    }

    /* ---------- Coin / Countdown ---------- */
    function coinHTML(mode, side = "dog", size = "") {
      let cls = "", wrap = "";

      if (mode === "spin") { cls = "spinning"; wrap = "tossing"; }
      else if (mode === "land") { cls = side === "cat" ? "land-cat" : "land-dog"; wrap = "hop"; }
      else if (mode === "settle") { cls = side === "cat" ? "settle-cat" : "settle-dog"; wrap = "hop-short"; }
      else if (mode === "final") { cls = side === "cat" ? "cat" : ""; wrap = "shrunk"; }
      else if (side === "cat") cls = "cat";

      const edges = [-3, -2, -1, 0, 1, 2, 3].map(k => `<div class="coin-edge" style="--k:${k}"></div>`).join("");

      return `
        <div class="coin-wrap ${wrap}">
          <div class="coin ${size} ${cls}">
            ${edges}
            <div class="coin-face">${chip("dog")}</div>
            <div class="coin-face back">${chip("cat")}</div>
          </div>
        </div>`;
    }

    const countdownHTML = end => `<div class="countdown ticker-countdown" data-end="${Number(end || 0)}">3</div>`;

    /* ---------- Lobby ---------- */
    const findMatch = id => asArray(STATE.matches).find(m => m.id === id);

    function renderLobby() {
      const matches = asArray(STATE.matches)
        .filter(m => m.state !== "cancelled")
        .slice()
        .sort((a, b) =>
          (Number(a.state === "finished") - Number(b.state === "finished")) ||
          (Number(b.hostValue) - Number(a.hostValue)));

      $("#summaryGames").textContent = matches.length;
      $("#gameCount").textContent = matches.length + " GAMES";
      $("#summaryValue").textContent = fmt(matches.reduce((s, m) => s + Number(m.hostValue || 0) + Number(m.oppValue || 0), 0));

      const sig = JSON.stringify([
        matches.map(m => [m.id, m.state, m.joiner && m.joiner.id, m.winnerId]),
        ME && ME.id
      ]);

      if (sig === lobbySig) return;
      lobbySig = sig;

      if (!matches.length) {
        $("#lobby").innerHTML = `<div class="card empty enter">No games right now.<br>Create the first coinflip!</div>`;
        return;
      }

      $("#lobby").innerHTML = matches.map(match => {
        const finished = match.state === "finished";
        const mine = ME && match.host?.id === ME.id;
        const hostWon = finished && match.winnerId === match.host?.id;
        const [low, high] = matchRange(Number(match.hostValue || 0));
        const isNew = !seenMatches.has(match.id);

        let middle;

        if (match.state === "waiting") {
          middle = `<b>${GEM}${short(match.hostValue)}</b><small>${short(low)} – ${short(high)}</small>`;
        } else if (match.state === "countdown") {
          middle = countdownHTML(match.countdownEnd);
        } else if (match.state === "flipping") {
          middle = coinHTML("spin");
        } else {
          middle = `${coinHTML("idle", match.winnerSide)}<small>${GEM}${short(Number(match.hostValue || 0) + Number(match.oppValue || 0))}</small>`;
        }

        const opponent = match.joiner
          ? `<div class="player clickable" data-action="user" data-id="${esc(match.joiner.id)}">
              ${playerAvatar(match.joiner, match.joinSide, "", finished && !hostWon ? "ring-orange" : "")}
              <div class="player-name">${esc(getUsername(match.joiner))}</div>
            </div>`
          : `<div class="player muted">Waiting for player…</div>`;

        let action = "";

        if (match.state === "waiting") {
          action = mine
            ? `<button class="btn red sm" data-action="cancel" data-id="${esc(match.id)}">Cancel</button>`
            : `<button class="btn sm" data-action="join" data-id="${esc(match.id)}">Join</button>`;
        }

        return `
          <div class="match ${finished ? "finished" : ""} ${isNew ? "enter" : ""}">
            <div class="m-left">
              <div class="player clickable" data-action="user" data-id="${esc(match.host?.id)}">
                ${playerAvatar(match.host, match.hostSide, "", finished && hostWon ? "ring-orange" : "")}
                <div class="player-name">${esc(getUsername(match.host))}</div>
              </div>
              <div class="items">${thumbs(match.hostItems)}</div>
            </div>

            <div class="match-middle">${middle}</div>

            <div class="m-right">
              ${opponent}
              <div class="match-actions">
                ${action}
                <button class="btn gray sm" data-action="view" data-id="${esc(match.id)}">View</button>
              </div>
            </div>
          </div>`;
      }).join("");

      matches.forEach(m => seenMatches.add(m.id));
    }

    /* ---------- View match ---------- */
    function itemRows(items) {
      const arr = asArray(items);
      if (!arr.length) return '<div class="irow muted">—</div>';

      return arr.map(i => `
        <div class="irow ${glow(i)}">
          <img src="${esc(itemImage(i))}" alt="">
          <div class="iname">${esc(i.name)}${tags(i)}</div>
          <b>${GEM}${short(i.value)}</b>
        </div>`).join("");
    }

    function buildView(match, phase, replay, mode = "reveal") {
      const joiner = match.joiner || match.opp;
      const finished = phase === "done";
      const settling = finished && mode === "settle";      /* coin is still landing: result not shown yet */
      const revealed = finished && !settling;
      const animRing = mode === "revealanim";
      const hostWon = revealed && match.winnerId === match.host?.id;
      const hostSide = match.hostSide || "dog";
      const joinSide = match.joinSide || (hostSide === "dog" ? "cat" : "dog");
      const mine = ME && match.host?.id === ME.id;

      const hostItems = asArray(match.hostItems);
      const oppItems = asArray(match.joinerItems || match.oppItems);
      const hv = Number(match.hostValue || 0);
      const ov = Number(match.oppValue || 0);
      const pot = hv + ov;
      const [low, high] = matchRange(hv);

      const status = replay && !finished
        ? ["replay", "REPLAY"]
        : settling
          ? ["flip", "FLIPPING"]
          : ({ wait: ["wait", "WAITING FOR PLAYER"], count: ["count", "STARTING"], flip: ["flip", "FLIPPING"], done: ["done", replay ? "REPLAY" : "FINISHED"] }[phase] || ["wait", "WAITING"]);

      let center;

      if (phase === "count") {
        const end = replay ? REPLAY.end : match.countdownEnd;
        center = `<div class="big-count ticker-countdown" data-end="${Number(end || 0)}">3</div>`;
      } else if (phase === "flip") {
        center = replay ? coinHTML("land", match.winnerSide, "big") : coinHTML("spin", "dog", "big");
      } else if (settling) {
        center = coinHTML("settle", match.winnerSide, "big");
      } else if (finished) {
        const winner = hostWon ? match.host : joiner;
        center = `${coinHTML("final", match.winnerSide, "big")}
          <div class="winner-text">${esc(getUsername(winner))} wins!<small>${GEM}${fmt(pot)} won</small></div>`;
      } else {
        center = `<div style="opacity:.55">${coinHTML("idle", hostSide, "big")}</div>
          <div class="vs-text">VS</div>
          <div class="vw-range">Join with ${GEM}${fmt(low)} – ${fmt(high)}</div>`;
      }

      const ringSvg = state => `<svg class="ring-svg" viewBox="0 0 100 100">${state ? `<circle class="r-win ${state === "anim" ? "anim" : ""}" cx="50" cy="50" r="46"/>` : ""}</svg>`;

      const card = (user, side, value, isHost) => {
        if (!user) {
          return `<div class="vw-player">
            <div class="vp-wait">?</div>
            <div class="vw-name muted">Waiting…</div>
            <div class="vw-bet muted">—</div>
          </div>`;
        }

        const won = revealed && (isHost ? hostWon : !hostWon);
        const cls = revealed ? (won ? "win" : "lose") : "";

        return `<div class="vw-player ${cls}">
          <div class="ring-wrap clickable" data-action="user" data-id="${esc(user.id)}">
            ${playerAvatar(user, side, "xl", "")}
            ${ringSvg(won ? (animRing ? "anim" : "static") : "")}
          </div>
          <div class="vw-name"><span class="n">${esc(getUsername(user))}</span>${isHost ? '<span class="vw-host">HOST</span>' : ""}</div>
          <div class="vw-bet">${GEM}${fmt(value)}</div>
        </div>`;
      };

      let footer = "";

      if (replay && finished) {
        footer = `
          <button class="btn gray" data-action="replay-back">← Back to history</button>
          <button class="btn" data-action="replay-again" data-id="${esc(match.id)}">Watch again</button>`;
      } else if (!replay && phase === "wait") {
        footer = mine
          ? `<button class="btn red" data-action="cancel" data-id="${esc(match.id)}">Cancel Match</button>`
          : `<button class="btn" data-action="join" data-id="${esc(match.id)}">Join Match</button>`;
      }

      const verify = revealed && match.seed
        ? `Seed: <code>${esc(match.seed)}</code><br>
           <button class="btn gray sm" style="margin-top:8px" data-action="verify" data-id="${esc(match.id)}">Verify result</button>
           <span id="verifyResult"></span>`
        : "Seed is revealed when the match ends.";

      return `
        <div class="vw-top">
          <span class="status ${status[0]}">${status[1]}</span>
          <div class="view-logo">${LOGO_MARK}<div>AMP<span>ROLL</span></div></div>
          <button class="x" data-action="${replay ? "replay-back" : "close"}">×</button>
        </div>

        <div class="vw-arena">
          ${card(match.host, hostSide, hv, true)}
          <div class="vw-center">${center}</div>
          ${card(joiner, joinSide, ov, false)}
        </div>

        <div class="view-hash"><b>#</b> ${esc(String(match.hash || "").slice(0, 22))}…</div>

        <div class="vw-lists">
          <div class="vw-col">
            <h4>${esc(getUsername(match.host))}'s items <span>${hostItems.length} · ${GEM}${short(hv)}</span></h4>
            <div class="vlist">${itemRows(hostItems)}</div>
          </div>
          <div class="vw-col">
            <h4>${joiner ? esc(getUsername(joiner)) + "'s items" : "Opponent"} <span>${joiner ? oppItems.length + " · " + GEM + short(ov) : "—"}</span></h4>
            <div class="vlist">${itemRows(oppItems)}</div>
          </div>
        </div>

        ${footer ? `<div class="modal-footer">${footer}</div>` : ""}

        <div class="fair"><b>Provably fair</b><br>Hash: <code>${esc(match.hash || "—")}</code><br>${verify}</div>`;
    }

    function showView(id) {
      gridContext = null;
      clearReplay();

    function renderView() {
      if (!viewMatchId || REPLAY || !$("#overlay").classList.contains("open")) return;

      let match = findMatch(viewMatchId);

      if (match) viewCache = match;
      else if (viewCache && viewCache.id === viewMatchId && viewCache.state === "finished") match = viewCache;

      const sig = match
        ? JSON.stringify([match.id, match.state, match.joiner && match.joiner.id, match.winnerId, ME && ME.id])
        : "gone";

      if (sig === viewSig) return;
      viewSig = sig;

      if (!match) {
        $("#modal").innerHTML = `${modalHeader("Match")}<div class="empty">This match is no longer in the lobby.</div>`;
        return;
      }

      const phase = { waiting: "wait", countdown: "count", flipping: "flip", finished: "done" }[match.state] || "wait";

      /* if the viewer watched the flip, let the coin land first and reveal the winner after */
      const settle = phase === "done" && (viewPrev === "flip" || viewPrev === "count");
      viewPrev = phase;

      clearTimeout(viewTimer);
      $("#modal").innerHTML = buildView(match, phase, false, settle ? "settle" : "reveal");

      if (settle) {
        const id = match.id;
        viewTimer = setTimeout(() => {
          if (viewMatchId !== id || REPLAY || !$("#overlay").classList.contains("open")) return;
          $("#modal").innerHTML = buildView(match, "done", false, "revealanim");
        }, 1500);
      }
    }

    function lookupMatch(id) {
      return findMatch(id) || (viewCache && viewCache.id === id ? viewCache : null) || HISTORY.find(m => m.id === id);
    }

    async function verifyMatch(id) {
      const match = lookupMatch(id);
      if (!match || !match.seed) return;

      try {
        const enc = new TextEncoder();
        const hex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

        const hash = hex(await crypto.subtle.digest("SHA-256", enc.encode(match.seed)));
        const key = await crypto.subtle.importKey("raw", enc.encode(match.seed), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
        const sig = hex(await crypto.subtle.sign("HMAC", key, enc.encode(String(match.id))));
        const roll = parseInt(sig.slice(0, 8), 16) / 4294967296;
        const result = roll < 0.5 ? "dog" : "cat";

        const ok = hash === match.hash && result === match.winnerSide;
        const target = $("#verifyResult");

        if (target) {
          target.innerHTML = ok
            ? ' <b class="positive">✔ Verified: hash and result match</b>'
            : ' <b class="negative">✘ Hash or result mismatch</b>';
        }
      } catch (error) { fail(error); }
    }

    /* ---------- Live data ---------- */
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, 150);
    }

    function connectSocket() {
      if (typeof io !== "function") return toast("Live connection unavailable", "err");
      if (socket) socket.disconnect();

      socket = io(API_BASE, { auth: { token } });

      socket.on("connect", scheduleRefresh);
      socket.on("disconnect", () => { $("#online").textContent = "Connecting…"; });

      socket.on("online", count => {
        $("#online").textContent = count + " online";
        $("#summaryOnline").textContent = count;
      });

      socket.on("chat:msg", m => {
        if (!STATE.chat.some(x => x.id === m.id)) {
          STATE.chat.push(m);
          STATE.chat = STATE.chat.slice(-60);
          renderChat();
        }
      });

      socket.on("chat:clear", () => { STATE.chat = []; renderChat(); });

      socket.on("event:update", ev => {
        if (ev && ev.status !== "finished" && ev.id !== lastEventId) {
          lastEventId = ev.id;
          toast((ev.type === "wheel" ? "🎡 Wheel" : "🔤 Word Scramble") + " event started! Click the banner to join.", "ok");
        }
        STATE.event = ev;
        renderEventStrip();
        if (currentPage === "event") renderEventPage();
      });

      ["match:new", "match:update", "match:remove", "giveaway:new", "giveaway:update", "giveaway:remove", "me:update", "announce:update"]
        .forEach(ev => socket.on(ev, scheduleRefresh));
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;

      try {
        const state = await api("/api/state");
        STATE = { ...STATE, ...state };

        if (token) {
          try {
            ME = (await api("/api/me")).user;
          } catch (error) {
            if (error.status === 401) {
              token = "";
              ME = null;
              localStorage.removeItem("amp_token");
              if (socket) connectSocket();
            } else throw error;
          }
        } else ME = null;

        if (!booted) {
          booted = true;
          $("#boot").style.display = "none";
          connectSocket();
        }

        renderHeader();
        renderLobby();
        renderGiveaways();
        renderBanner();
        if (STATE.event && !lastEventId) lastEventId = STATE.event.id;
        renderEventStrip();
        if (currentPage === "event") renderEventPage();
        renderChat();

        $("#online").textContent = Number(STATE.online || 0) + " online";
        $("#summaryOnline").textContent = Number(STATE.online || 0);

        renderView();

        if (gridContext && $("#grid")) {
          const s = inventory().map(itemId).join(",");
          if (s !== gridSig) renderGrid();
        }
      } catch (error) {
        if (!booted) $("#bootMessage").textContent = "Server connecting… Render may take some time to wake up.";
      } finally {
        refreshing = false;
      }
    }

    setInterval(() => { if (!document.hidden) refresh(); }, 3000);

    setInterval(() => {
      const time = Date.now();

      document.querySelectorAll(".ticker-countdown").forEach(el => {
        const s = Math.ceil((Number(el.dataset.end) - time) / 1000);
        el.textContent = s > 0 ? s : "…";
      });

      document.querySelectorAll(".ticker-giveaway").forEach(el => {
        const s = Math.max(0, Math.ceil((Number(el.dataset.end) - time) / 1000));
        el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      });
    }, 250);

          <select class="control" id="gridSort">
            <option value="value-desc">High - Low</option>

    function renderGrid() {
      if (!gridContext || !$("#grid")) return;

      const query = ($("#gridSearch")?.value || "").toLowerCase();
      const sort = $("#gridSort")?.value || "value-desc";
      const all = inventory();

      const items = all.filter(i => String(i.name || "").toLowerCase().includes(query));

      items.sort((a, b) => {
        if (sort === "value-asc") return Number(a.value || 0) - Number(b.value || 0);
        if (sort === "name") return String(a.name || "").localeCompare(String(b.name || ""));
        return Number(b.value || 0) - Number(a.value || 0);
      });

      $("#inventoryWorth").textContent = fmt(totalValue(all));
      $("#inventoryCount").textContent = all.length;

      $("#grid").innerHTML = items.map(item => {
        const id = itemId(item);
        const checked = selected.has(id);

        return `
          <div class="inventory-item ${checked ? "selected" : ""}" data-action="pick" data-id="${esc(id)}">
            ${checked ? '<span class="check">✓</span>' : ""}
            <img src="${esc(itemImage(item))}" alt="">
            <div class="name">${esc(item.name)}</div>
            <div class="value">${GEM}${fmt(item.value)}</div>
            ${tags(item)}
          </div>`;
      }).join("");

      if (!all.length) {
        $("#inventoryEmpty").innerHTML = `
          <div class="inventory-empty">
            <h2>No Items!</h2>
            <p>Your inventory seems to be empty...</p>
            <button class="btn" data-action="deposit">Deposit Items</button>
          </div>`;
      } else if (!items.length) {
        $("#inventoryEmpty").innerHTML = '<div class="empty">No items match your search.</div>';
      } else {
        $("#inventoryEmpty").innerHTML = "";
      }

      gridSig = all.map(itemId).join(",");
      gridContext.info();
    }

    function bindGrid() {
      $("#gridSearch")?.addEventListener("input", renderGrid);
      $("#gridSort")?.addEventListener("change", renderGrid);
      renderGrid();
    }

    function pickItem(id) {
      if (!gridContext) return;

      if (selected.has(id)) {
        selected.delete(id);
      } else {
        if (selected.size >= gridContext.max) return toast(`You can select up to ${gridContext.max} items`, "err");
        selected.add(id);
      }

      renderGrid();
    }

    function selectAll() {
      if (!gridContext) return;
      selected.clear();

      for (const item of inventory()) {
        if (selected.size >= gridContext.max) break;
        selected.add(itemId(item));
      }

      renderGrid();
    }

    /* ---------- Confirm box (in-site, replaces the browser popup) ---------- */
    let confirmCancel = null;

    function confirmBox({ title = "Are you sure?", text = "", ok = "Confirm", danger = false, checkbox = null } = {}) {
      return new Promise(resolve => {
        const overlay = $("#overlay3");

        $("#modal3").innerHTML = `
          <div class="mh"><h3>${esc(title)}</h3></div>
          <p class="hint" style="font-size:14px;color:#c8cad1">${esc(text)}</p>
          ${checkbox ? `<label class="check-row"><input type="checkbox" id="cbChk" ${checkbox.checked ? "checked" : ""}> ${esc(checkbox.label)}</label>` : ""}
          <div class="modal-footer">
            <button class="btn gray" id="cbNo">Cancel</button>
            <button class="btn ${danger ? "red" : ""}" id="cbYes">${esc(ok)}</button>
          </div>`;

        overlay.classList.add("open");

        const done = value => {
          overlay.classList.remove("open");
          confirmCancel = null;
          resolve(value);
        };

        confirmCancel = () => done(null);
        $("#cbNo").onclick = () => done(null);
        $("#cbYes").onclick = () => done({ checked: !!($("#cbChk") && $("#cbChk").checked) });
        overlay.onmousedown = e => { if (e.target === overlay) done(null); };
      });
    }

    function openEvent() {
