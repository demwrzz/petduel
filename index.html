<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMP ROLL | The LEADING Adopt Me item coinflip</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2300efa0'/%3E%3Ccircle cx='50' cy='50' r='38' fill='%23101218'/%3E%3Cellipse cx='50' cy='62' rx='14' ry='11' fill='%2300efa0'/%3E%3Cellipse cx='33' cy='46' rx='6' ry='8' fill='%2300efa0'/%3E%3Cellipse cx='45' cy='36' rx='6' ry='8' fill='%2300efa0'/%3E%3Cellipse cx='57' cy='36' rx='6' ry='8' fill='%2300efa0'/%3E%3Cellipse cx='69' cy='46' rx='6' ry='8' fill='%2300efa0'/%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg: #101218;
      --header: #14161e;
      --panel: #191c25;
      --panel-2: #151820;
      --border: #292d38;
      --muted: #8d909a;
      --text: #f6f7fb;
      --green: #00efa0;
      --orange: #ffb52e;
      --red: #ff5968;
      --line: #292d38;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { color: var(--text); outline: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #343946; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app { display: flex; min-height: 100vh; flex-direction: column; }

    /* ---------- ICONS ---------- */
    .gem-i { width: 1em; height: 1em; vertical-align: -.14em; margin-right: 3px; }
    .chip { width: 100%; height: 100%; display: block; }
    .muted { color: var(--muted); }

    /* ---------- HEADER ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; gap: 28px;
      height: 76px; padding: 0 25px;
      border-bottom: 1px solid var(--border);
      background: var(--header);
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      flex: none; cursor: pointer;
      font-size: 25px; font-weight: 800; letter-spacing: -1px;
      transition: transform .2s;
    }
    .logo:hover { transform: scale(1.03); }
    .logo svg { width: 38px; height: 38px; }
    .logo span { color: var(--green); }

    .nav { display: flex; flex: 1; align-items: center; height: 100%; gap: 8px; }

    .nav-item {
      display: flex; align-items: center; height: 100%;
      padding: 0 16px; border-bottom: 3px solid var(--green);
      cursor: pointer; font-weight: 700;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .wallet {
      display: flex; align-items: stretch; overflow: hidden;
      height: 44px; border-radius: 8px; background: #1b1e27;
      border: 1px solid var(--border);
    }

    .wallet-bal {
      display: flex; align-items: center; gap: 8px;
      padding: 0 16px; cursor: pointer; font-weight: 800; font-size: 15px;
    }
    .wallet-bal .gem-i { width: 22px; height: 22px; margin: 0; }

    .wallet-btn {
      padding: 0 20px; color: #04120b; background: var(--green);
      font-weight: 800; transition: filter .2s;
    }
    .wallet-btn:hover { filter: brightness(1.1); }

    .user-menu-wrap { position: relative; }

    .user-button {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 10px; height: 44px; border-radius: 8px;
      color: var(--text); background: transparent; font-weight: 700;
      transition: background .2s;
    }
    .user-button:hover { background: #20232c; }

    .user-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
      min-width: 200px; padding: 6px;
      border: 1px solid var(--border); border-radius: 8px;
      background: #20232c; box-shadow: 0 12px 30px #0008;
      opacity: 0; transform: translateY(-6px); pointer-events: none;
      transition: opacity .18s, transform .18s;
    }
    .user-menu.open { opacity: 1; transform: none; pointer-events: auto; }

    .user-menu button {
      display: block; width: 100%; padding: 11px; border-radius: 5px;
      color: var(--text); background: transparent; text-align: left;
      transition: background .15s;
    }
    .user-menu button:hover { background: #30343f; }

    /* ---------- AVATARS ---------- */
    .av {
      display: inline-grid; flex: none; place-items: center;
      width: 40px; height: 40px; overflow: hidden; border-radius: 50%;
      object-fit: cover; color: #fff; background: #3a4050; font-weight: 800;
      box-shadow: 0 0 0 2px #2c313c;
    }
    .av.sm { width: 29px; height: 29px; font-size: 11px; }
    .av.lg { width: 72px; height: 72px; font-size: 24px; }
    .av.xl { width: 118px; height: 118px; font-size: 38px; }
    .av.ring-green { box-shadow: 0 0 0 3px var(--green); }
    .av.ring-orange { box-shadow: 0 0 0 3px var(--orange); }
    .av.ring-dim { box-shadow: 0 0 0 2px #2c313c; }

    .pa { position: relative; display: inline-block; flex: none; }
    .pa .badge { position: absolute; left: -5px; bottom: -4px; width: 42%; height: 42%; }
    .pa.sm .badge { width: 50%; height: 50%; }
    .pa.xl .badge { width: 40%; height: 40%; left: 0; bottom: 2px; }

    /* ---------- BUTTONS ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 40px; padding: 0 17px; border-radius: 6px;
      color: #06130d; background: var(--green); font-weight: 800;
      transition: filter .2s, transform .12s, background .2s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn.sm { min-height: 32px; padding: 0 12px; font-size: 12px; }
    .btn.gray { border: 1px solid #414650; color: #d7d9e0; background: #292d37; }
    .btn.outline { border: 1px solid var(--green); color: var(--green); background: #17312c; }
    .btn.red { color: #fff; background: #d94453; }
    .btn.sun { color: #211500; background: var(--orange); }
    .btn.mint { color: #06130d; background: var(--green); }

    .eye {
      display: grid; place-items: center; width: 46px; height: 46px;
      border-radius: 7px; color: #fff; background: #292d37;
      transition: background .2s, transform .12s;
    }
    .eye:hover { background: #363b49; }
    .eye:active { transform: scale(.94); }
    .eye svg { width: 22px; height: 22px; }

    /* ---------- LAYOUT ---------- */
    .main {
      display: grid; grid-template-columns: 330px minmax(0, 1fr);
      gap: 16px; width: 100%; max-width: 1700px;
      margin: 0 auto; padding: 18px; flex: 1;
    }

    .content { min-width: 0; }

    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
      margin-bottom: 14px; padding: 18px 20px;
      border: 1px solid #8f681d; border-radius: 7px;
      background: linear-gradient(100deg, #30271d, #211f22);
    }
    .banner h1 { margin: 0 0 5px; color: var(--orange); font-size: 20px; }
    .banner p { margin: 0; color: #bab4a5; font-size: 13px; }
    .banner .chips { display: flex; gap: 8px; }
    .banner .chips div { width: 46px; height: 46px; }

    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      margin-bottom: 16px; overflow: hidden;
      border: 1px solid var(--border); border-radius: 7px; background: var(--border);
    }
    .summary div { padding: 15px; background: var(--panel); }
    .summary b { display: block; font-size: 19px; }
    .summary small { color: var(--muted); font-weight: 600; }

    .section-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-head h2 { flex: 1; margin: 0; font-size: 17px; }

    .pill {
      padding: 5px 9px; border-radius: 5px; color: var(--green);
      background: #15372d; font-size: 11px; font-weight: 800;
    }

    .card { border: 1px solid var(--border); border-radius: 7px; background: var(--panel); }

    /* ---------- ANIMATIONS ---------- */
    .enter { animation: enter .38s cubic-bezier(.2, .8, .2, 1) both; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } }

    /* ---------- MATCHES ---------- */
    .match-list { display: flex; flex-direction: column; gap: 8px; }

    .match {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) minmax(130px, 1.4fr) 100px minmax(130px, 1fr) auto;
      align-items: center; gap: 12px; min-height: 92px; padding: 14px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
      transition: border-color .25s, background .25s, transform .2s;
    }
    .match:hover { border-color: #3a4050; transform: translateY(-1px); }
    .match.finished { border-color: #715322; background: #24221f; }

    .player { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .player-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

    .items { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }

    .item-thumb {
      display: grid; place-items: center; width: 48px; height: 48px; overflow: hidden;
      border: 1px solid #353a45; border-radius: 6px; background: #222630;
      transition: transform .2s;
    }
    .item-thumb:hover { transform: translateY(-2px); }
    .item-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .match-middle { text-align: center; }
    .match-middle b { color: var(--green); }
    .match-middle small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .match-actions { display: flex; gap: 6px; justify-content: flex-end; }

    .empty { padding: 50px 15px; color: var(--muted); text-align: center; }

    /* ---------- COIN ---------- */
    .coin-wrap { display: inline-block; perspective: 900px; }
    .coin-wrap.tossing { animation: toss 1.1s ease-in-out infinite; }

    @keyframes toss {
      50% { transform: translateY(-14px); }
    }

    .coin { --s: 48px; position: relative; width: var(--s); height: var(--s); transform-style: preserve-3d; }
    .coin.big { --s: 170px; }
    .coin.cat { transform: rotateY(180deg); }
    .coin.spinning { animation: coin-spin .6s linear infinite; }
    .coin.land-dog { animation: land-dog 3.6s cubic-bezier(.15, .6, .2, 1) forwards; }
    .coin.land-cat { animation: land-cat 3.6s cubic-bezier(.15, .6, .2, 1) forwards; }

    .coin-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .coin-face.back { transform: rotateY(180deg); }
    .coin .chip { filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .45)); }

    @keyframes coin-spin { to { transform: rotateY(360deg); } }
    @keyframes land-dog { from { transform: rotateY(0); } to { transform: rotateY(2160deg); } }
    @keyframes land-cat { from { transform: rotateY(0); } to { transform: rotateY(2340deg); } }

    .coin-stage { position: relative; display: inline-block; }
    .coin-stage .coin { opacity: .45; }

    .count-over {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; font-size: 64px; font-weight: 800; text-shadow: 0 4px 18px #000;
    }

    .countdown {
      display: grid; place-items: center; width: 46px; height: 46px; margin: auto;
      border: 3px solid var(--orange); border-radius: 50%;
      color: var(--orange); font-size: 19px; font-weight: 800;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.1); } }

    /* ---------- SIDEBAR / CHAT ---------- */
    .sidebar {
      position: sticky; top: 94px; display: flex; flex-direction: column; gap: 10px;
      height: calc(100vh - 112px); min-height: 420px;
    }

    .giveaways { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }

    .giveaway-card {
      display: flex; align-items: center; gap: 8px; padding: 10px;
      border: 1px solid #6a5528; border-radius: 6px; background: #29251e;
    }
    .giveaway-card img { width: 44px; height: 44px; object-fit: contain; }
    .giveaway-info { flex: 1; min-width: 0; color: #ddd3be; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .giveaway-info b { color: #fff; }

    .chat {
      display: flex; flex: 1; flex-direction: column; min-height: 0; overflow: hidden;
      border: 1px solid var(--border); border-radius: 7px; background: var(--panel);
    }
    .chat-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px; border-bottom: 1px solid var(--border); font-weight: 800;
    }
    .online { color: var(--green); font-size: 11px; }

    .messages {
      display: flex; flex: 1; flex-direction: column; gap: 13px;
      overflow-y: auto; padding: 14px; scroll-behavior: smooth;
    }

    .message {
      display: flex; align-items: flex-start; gap: 8px;
      color: #c8cad1; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere;
    }
    .message b { color: #fff; }

    .rank {
      display: inline-block; margin-right: 3px; padding: 1px 5px; border-radius: 3px;
      color: #dce1e9; background: #444b59; font-size: 9px; font-weight: 800;
    }
    .rank.ADMIN { color: #fff; background: #d94453; }
    .rank.Whale { color: #211500; background: var(--orange); }

    .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    .chat-input input {
      flex: 1; min-width: 0; padding: 10px; border: 1px solid #373b46;
      border-radius: 5px; background: #11141b; transition: border-color .2s;
    }
    .chat-input input:focus { border-color: var(--green); }

    /* ---------- MODALS ---------- */
    .ov {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 18px;
      background: rgba(0, 0, 0, .76);
    }
    .ov.top { z-index: 110; background: rgba(0, 0, 0, .55); }
    .ov.open { display: flex; animation: fade .2s ease both; }

    .modal {
      width: min(560px, 100%); max-height: 92vh; overflow: auto; padding: 18px;
      border: 1px solid #292d37; border-radius: 8px; background: #14171f;
      box-shadow: 0 20px 70px #000a; animation: pop .25s cubic-bezier(.2, .8, .2, 1) both;
    }
    .modal.wide { width: min(1024px, 100%); }
    .modal.view { width: min(900px, 100%); }
    .modal.small { width: min(640px, 100%); }

    .mh { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .mh h3 { flex: 1; margin: 0; font-size: 18px; }

    .x { width: 30px; height: 30px; color: #a4a6ae; background: transparent; font-size: 24px; transition: color .2s; }
    .x:hover { color: #fff; }

    .hint { margin: 7px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }

    .in, .row input:not([type="checkbox"]), .row select, .control {
      min-width: 0; padding: 12px; border: 2px solid #484b54; border-radius: 7px;
      color: var(--text); background: #14171f; transition: border-color .2s;
    }
    .in:focus, .row input:focus, .control:focus { border-color: var(--green); }
    .row input[type="text"] { flex: 1; }

    .inventory-tools {
      display: grid; grid-template-columns: minmax(150px, 2fr) minmax(130px, .9fr) minmax(140px, .9fr);
      gap: 8px; margin-bottom: 15px;
    }

    .inventory-box { min-height: 370px; padding: 16px; border-radius: 7px; background: #191c25; }

    .inventory-summary { display: flex; align-items: center; gap: 24px; margin-bottom: 15px; }
    .inventory-summary small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }
    .inventory-summary b { font-size: 18px; }
    .inventory-summary .big-gem { width: 34px; height: 34px; }

    .inventory-plus {
      width: 32px; height: 32px; border-radius: 6px; color: #04120b;
      background: var(--green); font-size: 19px; font-weight: 800; transition: filter .2s;
    }
    .inventory-plus:hover { filter: brightness(1.1); }

    .inventory-empty {
      display: flex; min-height: 260px; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .inventory-empty h2 { margin: 0 0 10px; font-size: 28px; }
    .inventory-empty p { margin: 0 0 24px; color: #bfc1c9; font-weight: 600; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 8px; max-height: 390px; overflow-y: auto;
    }

    .inventory-item {
      position: relative; min-height: 150px; padding: 8px;
      border: 2px solid #30343e; border-radius: 6px; background: #20242e;
      text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
    }
    .inventory-item:hover { transform: translateY(-2px); border-color: #4a5060; }
    .inventory-item.selected { border-color: var(--green); background: #19372f; }
    .inventory-item img { width: 75px; height: 75px; object-fit: contain; }
    .inventory-item .name { height: 30px; overflow: hidden; font-size: 11px; font-weight: 700; }
    .inventory-item .value { margin-top: 4px; color: var(--green); font-size: 12px; font-weight: 800; }

    .check {
      position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 4px;
      color: #07120d; background: var(--green); font-weight: 800;
    }

    /* Item tags: Fly = blue, Ride = red, Mega = purple, Neon = green */
    .tg { display: flex; justify-content: center; gap: 3px; margin-top: 3px; }
    .tg i {
      padding: 1px 5px; border-radius: 3px; color: #fff;
      font-size: 9px; font-style: normal; font-weight: 800;
    }
    .tg .M { background: #a855f7; }
    .tg .N { background: #22c55e; color: #04230f; }
    .tg .F { background: #3b82f6; }
    .tg .R { background: #ef4444; }

    .modal-footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .sides { display: flex; gap: 10px; margin-bottom: 14px; }
    .side-choice {
      display: grid; place-items: center; flex: 1; padding: 14px;
      border: 2px solid #343842; border-radius: 8px; background: #20242e;
      cursor: pointer; transition: border-color .2s, background .2s, transform .15s;
    }
    .side-choice:hover { transform: translateY(-2px); }
    .side-choice.selected { border-color: var(--green); background: #19372f; }
    .side-choice div { width: 70px; height: 70px; }

    /* ---------- VIEW MATCH ---------- */
    .view-top { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 8px; }
    .view-top .x { position: absolute; right: 0; top: 0; }
    .view-logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
    .view-logo svg { width: 30px; height: 30px; }
    .view-logo span { color: var(--green); }

    .view-players {
      display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: center;
      gap: 10px; padding: 18px 0 6px;
    }
    .vp { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
    .vp-name { max-width: 100%; overflow: hidden; font-size: 16px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .vp-wait {
      display: grid; place-items: center; width: 118px; height: 118px; border-radius: 50%;
      border: 2px dashed #3a3f4c; color: var(--muted); font-size: 30px; font-weight: 800;
    }
    .vp-center { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 190px; justify-content: center; }
    .vs-text { font-size: 18px; font-weight: 800; color: var(--muted); letter-spacing: 3px; }
    .winner-text { font-weight: 800; color: var(--green); animation: enter .4s both; }

    .view-hash {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      margin: 16px 0; color: #a2a6b3; font-size: 13px;
    }
    .view-hash b { color: #fff; }

    .view-boxes, .view-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }

    .vbox {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 16px; border: 1px solid #2c303b; border-radius: 6px;
      background: #191c25; color: #8d909a;
    }
    .vbox b { color: #fff; }

    .vlist { display: flex; flex-direction: column; gap: 8px; }
    .irow {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px;
      border: 1px solid #2c303b; border-radius: 6px; background: #191c25;
      animation: enter .4s both;
    }
    .irow img { width: 54px; height: 54px; object-fit: contain; }
    .iname { flex: 1; min-width: 0; font-weight: 700; }
    .iname .tg { display: inline-flex; margin: 0 0 0 6px; }

    .fair {
      margin-top: 14px; padding: 12px; border-radius: 6px; color: #a6aab5;
      background: #1b1e27; font-size: 11px; line-height: 1.7; overflow-wrap: anywhere;
    }
    .fair code { color: #e5e7ec; }

    .seg { display: flex; gap: 5px; margin-bottom: 12px; }
    .seg button { flex: 1; padding: 10px; border-radius: 5px; color: #b6b8c0; background: #242832; font-weight: 700; transition: background .2s; }
    .seg button.on { color: #07120d; background: var(--green); }

    /* ---------- HISTORY ---------- */
    .hrow {
      display: grid; grid-template-columns: 130px minmax(0, 1fr) 60px 50px;
      align-items: center; gap: 12px; margin-bottom: 8px; padding: 12px 16px;
      border: 1px solid #292d38; border-radius: 6px; background: #191c25;
      transition: background .2s;
    }
    .hrow:hover { background: #1e222c; }
    .hplayers { display: flex; align-items: center; gap: 12px; }
    .hitems { display: flex; align-items: center; padding-left: 10px; }
    .hitems .ci {
      display: grid; place-items: center; width: 48px; height: 48px; margin-left: -10px;
      overflow: hidden; border: 2px solid #14171f; border-radius: 50%; background: #20242e;
      font-weight: 800; font-size: 12px; color: #aab;
    }
    .hitems .ci img { width: 100%; height: 100%; object-fit: contain; }
    .hwin { width: 46px; height: 46px; }

    /* ---------- DEPOSIT / BOTS ---------- */
    .game-card {
      display: flex; align-items: center; gap: 14px; width: 290px; height: 82px;
      padding: 0 20px; overflow: hidden; border: 1px solid #5a4724; border-radius: 6px;
      background: linear-gradient(100deg, #5d4420, #2a2724 75%);
      cursor: pointer; font-size: 17px; font-weight: 800;
      transition: transform .2s, border-color .2s;
    }
    .game-card:hover { transform: translateY(-3px); border-color: var(--orange); }
    .game-card .pic { font-size: 38px; letter-spacing: -6px; }

    .warn {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 13px 16px;
      border: 1px solid #a8741a; border-radius: 8px; background: #2b241d;
      color: #ffc65a; font-weight: 700; font-size: 13px; line-height: 1.5;
    }
    .warn i {
      display: grid; place-items: center; flex: none; width: 26px; height: 26px;
      border-radius: 50%; color: #1a1100; background: var(--orange);
      font-style: normal; font-weight: 800;
    }
    .claim {
      margin-bottom: 14px; padding: 14px 16px; border: 1px solid var(--green);
      border-radius: 8px; background: #15332a; color: var(--green);
      font-size: 15px; font-weight: 800; text-align: center; animation: enter .4s both;
    }

    .bot-row {
      display: flex; align-items: stretch; overflow: hidden; margin-bottom: 8px;
      border: 1px solid #2c303b; border-radius: 8px; background: #191c25;
    }
    .bot-main { display: flex; flex: 1; align-items: center; gap: 12px; padding: 10px 14px; font-weight: 700; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #0fbf7c; box-shadow: 0 0 8px #0fbf7c; }
    .bot-row .join {
      min-width: 76px; color: #04120b; background: var(--green);
      font-weight: 800; transition: filter .2s;
    }
    .bot-row .join:hover { filter: brightness(1.1); }

    .code {
      margin: 14px 0; padding: 16px; border: 1px dashed var(--green); border-radius: 6px;
      color: var(--green); background: #172a24; text-align: center;
      font-size: 18px; font-weight: 800; user-select: all;
    }

    /* ---------- PROFILE ---------- */
    .profile-card { padding: 18px; }
    .profile-head { display: flex; align-items: center; gap: 15px; }
    .profile-head h2 { margin: 0 0 6px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
    .stat { padding: 16px; border: 1px solid var(--border); border-radius: 6px; background: #20242e; }
    .stat small { display: block; margin-bottom: 8px; color: var(--muted); }
    .stat b { font-size: 20px; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 11px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); }

    .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 14px; }
    .pagination button { min-width: 34px; height: 34px; border-radius: 5px; color: #fff; background: #30343e; }
    .pagination button.on { color: #06130d; background: var(--green); }

    /* ---------- TOASTS / BOOT ---------- */
    .toasts { position: fixed; top: 88px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      max-width: 320px; padding: 12px 15px; border: 1px solid #444; border-radius: 6px;
      color: #fff; background: #252a34; box-shadow: 0 8px 25px #0008;
      animation: enter .3s both;
    }
    .toast.err { background: #9e303d; }
    .toast.ok { color: #04120b; background: var(--green); }

    #boot {
      position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 15px; padding: 20px;
      background: #11141b; text-align: center; font-weight: 700;
    }
    .loader { width: 42px; height: 42px; border: 4px solid #323844; border-top-color: var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Admin UI returned by server */
    #adm .modal { color: var(--text); background: #14171f; }
    #adm [style*="background:#f5faff"] { background: #20242e !important; }
    #adm [style*="border:2px solid #e0edfb"] { border-color: #343842 !important; }
    #adm [style*="border-bottom:1px solid #e0edfb"] { border-color: #343842 !important; }

    @media (max-width: 1050px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { position: static; height: 480px; order: 2; }
      .match { grid-template-columns: 1fr 1fr; }
      .match .items, .match-middle, .match-actions { grid-column: 1 / -1; }
      .match-actions { justify-content: flex-start; }
    }

    @media (max-width: 650px) {
      .topbar { flex-wrap: wrap; height: auto; min-height: 70px; gap: 8px; padding: 10px; }
      .logo { font-size: 21px; }
      .nav { display: none; }
      .header-right { margin-left: auto; }
      .user-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
      .main { padding: 10px; }
      .summary, .stats { grid-template-columns: 1fr; }
      .inventory-tools { grid-template-columns: 1fr; }
      .view-players { grid-template-columns: 1fr; }
      .view-boxes, .view-lists { grid-template-columns: 1fr; }
      .hrow { grid-template-columns: 1fr 50px; }
      .hitems { grid-column: 1 / -1; order: 3; }
      .coin.big { --s: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>

  <div id="boot">

  <div class="ov" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="ov top" id="overlay2"><div class="modal small" id="modal2"></div></div>

  <div class="app">
    <header class="topbar">
      <div class="logo" data-action="home">
        <svg viewBox="0 0 100 100"><use href="#logo-mark"/></svg>

      <section class="content">

        <div class="summary">
          <div><b id="summaryGames">0</b><small>Live Games</small></div>
          <div><b id="summaryValue">0</b><small>Total Lobby Value</small></div>
          <div><b id="summaryOnline">0</b><small>Players Online</small></div>
        </div>

        <div class="section-head">
          <h2>COINFLIP GAMES</h2>
          <span class="pill" id="gameCount">0 GAMES</span>
          <button class="btn gray" data-action="history">History</button>

    <main class="main" id="profilePage" style="display:none;grid-template-columns:1fr">
      <div id="profile"></div>
    </main>
  </div>

  <script>
    "use strict";

    const API_BASE = window.location.origin;
    const BOT_NAME = "DedokAmp";
    const BOT_LINK = "https://www.roblox.com/share?code=a0dd8a7bc68f034b99e078f454d4e903&type=Server";

    /* ---------- Coin designs (site specific) ---------- */
    (function buildSymbols() {
      const notches = color => Array.from({ length: 8 }, (_, i) =>
        `<rect x="43" y="3" width="14" height="10" rx="3" fill="${color}" transform="rotate(${i * 45} 50 50)"/>`
      ).join("");

      const paw = `
        <g fill="#fffaf0">
          <ellipse cx="50" cy="60" rx="13" ry="10"/>
          <ellipse cx="35" cy="46" rx="5" ry="6.5" transform="rotate(-25 35 46)"/>
          <ellipse cx="44" cy="37" rx="5" ry="7"/>
          <ellipse cx="56" cy="37" rx="5" ry="7"/>
          <ellipse cx="65" cy="46" rx="5" ry="6.5" transform="rotate(25 65 46)"/>
        </g>`;

      const cat = `
        <g fill="#f4fff9">
          <polygon points="32,48 33,27 47,39"/>
          <polygon points="68,48 67,27 53,39"/>
          <ellipse cx="50" cy="55" rx="19" ry="16"/>
        </g>
        <g fill="#00835a">
          <circle cx="43" cy="53" r="2.8"/>
          <circle cx="57" cy="53" r="2.8"/>
          <polygon points="47,59 53,59 50,63"/>
        </g>
        <g stroke="#00835a" stroke-width="1.2" stroke-linecap="round">
          <line x1="30" y1="58" x2="40" y2="59"/><line x1="30" y1="63" x2="40" y2="61"/>
          <line x1="70" y1="58" x2="60" y2="59"/><line x1="70" y1="63" x2="60" y2="61"/>
        </g>`;

      document.getElementById("symbols").insertAdjacentHTML("beforeend", `
        <symbol id="chip-dog" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="url(#gOrange)" stroke="#b45f00" stroke-width="2"/>
          ${notches("#fff3d1")}
          <circle cx="50" cy="50" r="33" fill="url(#gOrangeIn)" stroke="#fff3d1" stroke-width="3"/>
          ${paw}
        </symbol>
        <symbol id="chip-cat" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="url(#gGreen)" stroke="#007a52" stroke-width="2"/>
          ${notches("#e6fff5")}
          <circle cx="50" cy="50" r="33" fill="url(#gGreenIn)" stroke="#e6fff5" stroke-width="3"/>
          ${cat}
        </symbol>
      `);
    })();

    const GEM = '<svg class="gem-i" viewBox="0 0 24 24"><use href="#gem"/></svg>';

    const chip = (side, cls = "") =>
      `<svg class="chip ${cls}" viewBox="0 0 100 100"><use href="#chip-${side === "cat" ? "cat" : "dog"}"/></svg>`;

    const EYE = '<svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.5 9 1 12c1.5 3 5.5 7 11 7s9.5-4 11-7c-1.5-3-5.5-7-11-7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>';

    const LOGO_MARK = '<svg viewBox="0 0 100 100"><use href="#logo-mark"/></svg>';

    /* ---------- Utilities ---------- */
    const $ = selector => document.querySelector(selector);

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);

    const fmt = value => Number(value || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });

    function short(n) {
      n = Number(n || 0);
      if (n >= 1e6) return Number((n / 1e6).toFixed(2)) + "M";
      if (n >= 1e3) return Number((n / 1e3).toFixed(1)) + "K";
      return fmt(n);
    }

    const asArray = v => Array.isArray(v) ? v : [];

    const getUsername = user => {
      if (!user) return "";
      if (typeof user === "string") return user;
      return user.username || user.name || "";
    };

    let token = localStorage.getItem("amp_token") || "";
    let ME = null;

    let STATE = { matches: [], giveaways: [], chat: [], bot: null, online: 0, config: { range: 0.10 } };

    let socket = null;
    let booted = false;
    let refreshing = false;
    let refreshTimer = null;

    let selected = new Set();
    let gridContext = null;
    let gridSig = "";
    let viewMatchId = null;
    let viewSig = "";
    let viewCache = null;
    let loginData = null;
    let createSide = "dog";
    let giveawayMode = "easy";

    let HISTORY = [];
    let REPLAY = null;
    let replayTimers = [];

    const seenMatches = new Set();
    const seenChat = new Set();
    let headerSig = "", lobbySig = "", chatSig = "", gwSig = "";

    /* ---------- API ---------- */
    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;

      const response = await fetch(API_BASE + path, {
        method: options.method || (options.body ? "POST" : "GET"),
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      const text = await response.text();
      let data = {};

      try { data = text ? JSON.parse(text) : {}; }
      catch { data = { message: text }; }

      if (!response.ok) {
        const error = new Error(data.error || data.message || `HTTP ${response.status}`);
        error.status = response.status;
        throw error;
      }

      return data;
    }

    function toast(message, type = "") {
      const el = document.createElement("div");
      el.className = "toast " + type;
      el.textContent = message;
      $("#toasts").appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    const fail = error => toast(error.message || String(error), "err");

    /* ---------- Helpers ---------- */
    function avatar(user, size = "", ring = "") {
      const name = getUsername(user) || "?";
      const image = user && (user.avatar || user.avatarUrl);

      if (image) {
        return `<img class="av ${size} ${ring}" src="${esc(image)}" alt="">`;
      }

      return `<span class="av ${size} ${ring}">${esc(name.charAt(0).toUpperCase())}</span>`;
    }

    function playerAvatar(user, side, size = "", ring = "") {
      return `<span class="pa ${size}">${avatar(user, size, ring)}<span class="badge">${chip(side)}</span></span>`;
    }

    function tags(item) {
      let r = "";
      if (item.age === "mega" || item.mega) r += '<i class="M">M</i>';
      if (item.age === "neon" || item.neon) r += '<i class="N">N</i>';
      if (item.fly) r += '<i class="F">F</i>';
      if (item.ride) r += '<i class="R">R</i>';
      return r ? `<div class="tg">${r}</div>` : "";
    }

    const itemId = item => String(item.uid || item.id || item.catalogId || "");
    const itemImage = item => item.image || item.imageUrl || "";
    const inventory = () => ME ? asArray(ME.inventory) : [];
    const totalValue = items => items.reduce((t, i) => t + Number(i.value || 0), 0);
    const selectedItems = () => inventory().filter(i => selected.has(itemId(i)));
    const selectedUids = () => selectedItems().map(itemId);

    function matchRange(value) {
      const t = Number(STATE.config?.range ?? 0.10);
      return [value * (1 - t), value * (1 + t)];
    }

    function thumbs(items, max = 6) {
      const arr = asArray(items);

      let html = arr.slice(0, max).map(i => `
        <div class="item-thumb" title="${esc(i.name)} • ${fmt(i.value)}">
          <img src="${esc(itemImage(i))}" alt="">
        </div>`).join("");

      if (arr.length > max) {
        html += `<div class="item-thumb"><b>+${arr.length - max}</b></div>`;
      }

      return html;
    }

    function requireLogin() {
      if (ME) return true;
      showLogin();
      return false;
    }

    $("#bannerChips").innerHTML = `<div>${chip("dog")}</div><div>${chip("cat")}</div>`;

    /* ---------- Modals ---------- */
    const modalHeader = title => `
      <div class="mh"><h3>${title}</h3><button class="x" data-action="close">×</button></div>`;

    function openModal(html, kind = "") {
      $("#modal").className = "modal " + kind;
      $("#modal").innerHTML = html;
      gridSig = "";
      $("#overlay").classList.add("open");
    }

    function clearReplay() {
      replayTimers.forEach(clearTimeout);
      replayTimers = [];
      REPLAY = null;
    }

    function closeModal() {
      $("#overlay").classList.remove("open");
      selected.clear();
      gridContext = null;
      viewMatchId = null;
      viewSig = "";
      viewCache = null;
      clearReplay();
    }

    function openModal2(html) {
      $("#modal2").innerHTML = html;
      $("#overlay2").classList.add("open");
    }

    function closeModal2() {
      $("#overlay2").classList.remove("open");
    }

    $("#overlay").addEventListener("mousedown", e => { if (e.target.id === "overlay") closeModal(); });
    $("#overlay2").addEventListener("mousedown", e => { if (e.target.id === "overlay2") closeModal2(); });

    /* ---------- Header ---------- */
    function renderHeader() {
      const inv = inventory();

      const sig = JSON.stringify(ME
        ? [ME.id, ME.username, ME.avatar, ME.isAdmin, inv.length, totalValue(inv)]
        : null);

      if (sig === headerSig) return;
      headerSig = sig;

      const target = $("#headerRight");

      if (!ME) {
        target.innerHTML = `<button class="btn" data-action="login">Login with Roblox</button>`;
        return;
      }

      const menuOpen = $("#userMenu") && $("#userMenu").classList.contains("open");

      target.innerHTML = `
        <div class="wallet">
          <div class="wallet-bal" data-action="wallet">${GEM}<span>${fmt(totalValue(inv))}</span></div>
          <button class="wallet-btn" data-action="wallet">Wallet</button>
        </div>

        <div class="user-menu-wrap">
          <button class="user-button" data-action="user-menu">
            ${avatar(ME, "sm")}
            <span class="user-name">${esc(ME.username)}</span>
          </button>

          <div class="user-menu ${menuOpen ? "open" : ""}" id="userMenu">
            <button data-action="profile">👤 Profile</button>
            <button data-action="giveaway">🎁 Create Giveaway</button>
            ${ME.isAdmin ? '<button data-action="admin">🛠 Admin Panel</button>' : ""}
            <button data-action="logout">🚪 Logout</button>
          </div>
        </div>`;
    }

    /* ---------- Coin / Countdown ---------- */
    function coinHTML(mode, side = "dog", size = "") {
      let cls = "";
      if (mode === "spin") cls = "spinning";
      else if (mode === "land") cls = side === "cat" ? "land-cat" : "land-dog";
      else if (side === "cat") cls = "cat";

      return `
        <div class="coin-wrap ${mode === "spin" ? "tossing" : ""}">
          <div class="coin ${size} ${cls}">
            <div class="coin-face">${chip("dog")}</div>
            <div class="coin-face back">${chip("cat")}</div>
          </div>
        </div>`;
    }

    const countdownHTML = end =>
      `<div class="countdown ticker-countdown" data-end="${Number(end || 0)}">3</div>`;

    /* ---------- Lobby ---------- */
    const findMatch = id => asArray(STATE.matches).find(m => m.id === id);

    function renderLobby() {
      const matches = asArray(STATE.matches)
        .filter(m => m.state !== "cancelled")
        .slice()
        .sort((a, b) =>
          (Number(a.state === "finished") - Number(b.state === "finished")) ||
          (Number(b.hostValue) - Number(a.hostValue)));

      $("#summaryGames").textContent = matches.length;
      $("#gameCount").textContent = matches.length + " GAMES";
      $("#summaryValue").textContent = fmt(matches.reduce(
        (s, m) => s + Number(m.hostValue || 0) + Number(m.oppValue || 0), 0));

      const sig = JSON.stringify([
        matches.map(m => [m.id, m.state, m.joiner && m.joiner.id, m.winnerId]),
        ME && ME.id
      ]);

      if (sig === lobbySig) return;
      lobbySig = sig;

      if (!matches.length) {
        $("#lobby").innerHTML = `<div class="card empty enter">No games right now.<br>Create the first coinflip!</div>`;
        return;
      }

      $("#lobby").innerHTML = matches.map(match => {
        const finished = match.state === "finished";
        const mine = ME && match.host?.id === ME.id;
        const hostWon = finished && match.winnerId === match.host?.id;
        const [low, high] = matchRange(Number(match.hostValue || 0));
        const isNew = !seenMatches.has(match.id);

        let middle;

        if (match.state === "waiting") {
          middle = `<b>${GEM}${short(match.hostValue)}</b><small>${short(low)} – ${short(high)}</small>`;
        } else if (match.state === "countdown") {
          middle = countdownHTML(match.countdownEnd);
        } else if (match.state === "flipping") {
          middle = coinHTML("spin");
        } else {
          middle = `${coinHTML("idle", match.winnerSide)}<small>${GEM}${short(Number(match.hostValue || 0) + Number(match.oppValue || 0))}</small>`;
        }

        const opponent = match.joiner
          ? `<div class="player">
              ${playerAvatar(match.joiner, match.joinSide, "", finished && !hostWon ? "ring-orange" : "")}
              <div class="player-name">${esc(getUsername(match.joiner))}</div>
            </div>`
          : `<div class="player muted">Waiting for player…</div>`;

        let action = "";

        if (match.state === "waiting") {
          action = mine
            ? `<button class="btn red sm" data-action="cancel" data-id="${esc(match.id)}">Cancel</button>`
            : `<button class="btn sm" data-action="join" data-id="${esc(match.id)}">Join</button>`;
        }

        return `
          <div class="match ${finished ? "finished" : ""} ${isNew ? "enter" : ""}">
            <div class="player">
              ${playerAvatar(match.host, match.hostSide, "", finished && hostWon ? "ring-orange" : "")}
              <div class="player-name">${esc(getUsername(match.host))}</div>
            </div>

            <div class="items">${thumbs(match.hostItems)}</div>
            <div class="match-middle">${middle}</div>
            ${opponent}

            <div class="match-actions">
              ${action}
              <button class="btn gray sm" data-action="view" data-id="${esc(match.id)}">View</button>
            </div>
          </div>`;
      }).join("");

      matches.forEach(m => seenMatches.add(m.id));
    }

    /* ---------- View match ---------- */
    function itemRows(items) {
      const arr = asArray(items);

      if (!arr.length) return '<div class="irow muted">—</div>';

      return arr.map(i => `
        <div class="irow">
          <img src="${esc(itemImage(i))}" alt="">
          <div class="iname">${esc(i.name)}${tags(i)}</div>
          <b>${GEM}${short(i.value)}</b>
        </div>`).join("");
    }

    function buildView(match, phase, replay) {
      const joiner = match.joiner || match.opp;
      const finished = phase === "done";
      const hostWon = finished && match.winnerId === match.host?.id;
      const hostSide = match.hostSide || "dog";
      const joinSide = match.joinSide || (hostSide === "dog" ? "cat" : "dog");
      const mine = ME && match.host?.id === ME.id;

      let center;

      if (phase === "count") {
        const end = replay ? REPLAY.end : match.countdownEnd;
        center = `<div class="coin-stage">${coinHTML("idle", "dog", "big")}<div class="count-over ticker-countdown" data-end="${Number(end || 0)}">3</div></div>`;
      } else if (phase === "flip") {
        center = replay ? coinHTML("land", match.winnerSide, "big") : coinHTML("spin", "dog", "big");
      } else if (finished) {
        center = coinHTML("idle", match.winnerSide, "big");
      } else {
        center = `<div style="opacity:.5">${coinHTML("idle", hostSide, "big")}</div><div class="vs-text">VS</div>`;
      }

      const winnerName = finished ? getUsername(hostWon ? match.host : joiner) : "";

      const hostRing = finished && hostWon ? "ring-green" : "ring-dim";
      const oppRing = finished && !hostWon ? "ring-green" : "ring-dim";

      const hostCol = `
        <div class="vp">
          ${playerAvatar(match.host, hostSide, "xl", hostRing)}
          <div class="vp-name">${esc(getUsername(match.host))}</div>
        </div>`;

      const oppCol = joiner
        ? `<div class="vp">
            ${playerAvatar(joiner, joinSide, "xl", oppRing)}
            <div class="vp-name">${esc(getUsername(joiner))}</div>
          </div>`
        : `<div class="vp"><div class="vp-wait">?</div><div class="vp-name muted">Waiting…</div></div>`;

      let footer = "";

      if (replay && finished) {
        footer = `
          <button class="btn gray" data-action="replay-back">← Back to history</button>
          <button class="btn" data-action="replay-again" data-id="${esc(match.id)}">Watch again</button>`;
      } else if (!replay && phase === "wait") {
        footer = mine
          ? `<button class="btn red" data-action="cancel" data-id="${esc(match.id)}">Cancel Match</button>`
          : `<button class="btn" data-action="join" data-id="${esc(match.id)}">Join Match</button>`;
      }

      const verify = finished && match.seed
        ? `Seed: <code>${esc(match.seed)}</code><br>
           <button class="btn gray sm" style="margin-top:8px" data-action="verify" data-id="${esc(match.id)}">Verify result</button>
           <span id="verifyResult"></span>`
        : "Seed is revealed when the match ends.";

      return `
        <div class="view-top">
          <div class="view-logo">${LOGO_MARK}<div>AMP<span>ROLL</span></div></div>
          <button class="x" data-action="${replay ? "replay-back" : "close"}">×</button>
        </div>

        <div class="view-players">
          ${hostCol}
          <div class="vp-center">
            ${center}
            ${finished ? `<div class="winner-text">${esc(winnerName)} wins!</div>` : ""}
            ${replay ? '<span class="pill">REPLAY</span>' : ""}
          </div>
          ${oppCol}
        </div>

        <div class="view-hash"><b>#</b> ${esc(String(match.hash || "").slice(0, 22))}…</div>

        <div class="view-boxes">
          <div class="vbox"><span>50.00%</span><b>${GEM}${short(match.hostValue)}</b></div>
          <div class="vbox"><span>50.00%</span><b>${joiner ? GEM + short(match.oppValue) : "—"}</b></div>
        </div>

        <div class="view-lists">
          <div class="vlist">${itemRows(match.hostItems)}</div>
          <div class="vlist">${itemRows(match.joinerItems || match.oppItems)}</div>
        </div>

        ${footer ? `<div class="modal-footer">${footer}</div>` : ""}

        <div class="fair"><b>Provably fair</b><br>Hash: <code>${esc(match.hash || "—")}</code><br>${verify}</div>`;
    }

    function showView(id) {
      gridContext = null;
      clearReplay();
      viewMatchId = id;
      viewSig = "";
      viewCache = null;
      openModal("", "view");
      renderView();
    }

    function renderView() {
      if (!viewMatchId || REPLAY || !$("#overlay").classList.contains("open")) return;

      let match = findMatch(viewMatchId);

      if (match) {
        viewCache = match;
      } else if (viewCache && viewCache.id === viewMatchId && viewCache.state === "finished") {
        match = viewCache;
      }

      const sig = match
        ? JSON.stringify([match.id, match.state, match.joiner && match.joiner.id, match.winnerId, ME && ME.id])
        : "gone";

      if (sig === viewSig) return;
      viewSig = sig;

      if (!match) {
        $("#modal").innerHTML = `${modalHeader("Match")}<div class="empty">This match is no longer in the lobby.</div>`;
        return;
      }

      const phase = { waiting: "wait", countdown: "count", flipping: "flip", finished: "done" }[match.state] || "wait";

      $("#modal").innerHTML = buildView(match, phase, false);
    }

    function lookupMatch(id) {
      return findMatch(id) ||
        (viewCache && viewCache.id === id ? viewCache : null) ||
        HISTORY.find(m => m.id === id);
    }

    async function verifyMatch(id) {
      const match = lookupMatch(id);

      if (!match || !match.seed) return;

      try {
        const enc = new TextEncoder();
        const hex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

        const hash = hex(await crypto.subtle.digest("SHA-256", enc.encode(match.seed)));

        const key = await crypto.subtle.importKey(
          "raw", enc.encode(match.seed), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);

        const sig = hex(await crypto.subtle.sign("HMAC", key, enc.encode(String(match.id))));
        const roll = parseInt(sig.slice(0, 8), 16) / 4294967296;
        const result = roll < 0.5 ? "dog" : "cat";

        const ok = hash === match.hash && result === match.winnerSide;
        const target = $("#verifyResult");

        if (target) {
          target.innerHTML = ok
            ? ' <b class="positive">✔ Verified: hash and result match</b>'
            : ' <b class="negative">✘ Hash or result mismatch</b>';
        }
      } catch (error) {
        fail(error);
      }
    }

    function startReplay(id) {

      if (!match) return;

      clearReplay();
      viewMatchId = null;
      gridContext = null;

      REPLAY = { match, phase: "count", end: Date.now() + 3000 };

      openModal("", "view");
      renderReplay();

      replayTimers.push(setTimeout(() => {
        if (!REPLAY) return;
        REPLAY.phase = "flip";
        renderReplay();
      }, 3000));

      replayTimers.push(setTimeout(() => {
        if (!REPLAY) return;
        REPLAY.phase = "done";
        renderReplay();
      }, 6600));

    /* ---------- Chat ---------- */
    function chatMessage(m, isNew) {
      const user = m.user || {};
      const rank = m.admin ? "ADMIN" : (m.rank || user.rank || "");

      return `
        <div class="message ${isNew ? "enter" : ""}">
          ${avatar(user, "sm")}

        </div>`;
    }

    function renderChat() {
      const chat = asArray(STATE.chat).slice(-60);
      const sig = chat.length + ":" + (chat.length ? chat[chat.length - 1].id : "") + ":" + (chat[0] ? chat[0].id : "");

      if (sig === chatSig) return;
      chatSig = sig;

      const box = $("#messages");
      const near = box.scrollHeight - box.scrollTop - box.clientHeight < 90;

      box.innerHTML = chat.map(m => chatMessage(m, !seenChat.has(m.id))).join("");
      chat.forEach(m => seenChat.add(m.id));

      if (near) box.scrollTop = box.scrollHeight;
    }

    function sendChat() {
      if (!requireLogin()) return;

      const input = $("#chatInput");
      const text = input.value.trim();

      if (!text) return;

      if (!socket || !socket.connected) return toast("Chat is connecting", "err");

      socket.emit("chat:send", { text }, response => {
        if (response && response.error) return toast(response.error, "err");
        input.value = "";
      });
    }

    $("#chatInput").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

    /* ---------- Live data ---------- */
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, 150);
    }

    function connectSocket() {
      if (typeof io !== "function") return toast("Live connection unavailable", "err");

      if (socket) socket.disconnect();

      socket = io(API_BASE, { auth: { token } });

      socket.on("connect", scheduleRefresh);
      socket.on("disconnect", () => { $("#online").textContent = "Connecting…"; });

      socket.on("online", count => {
        $("#online").textContent = count + " online";
        $("#summaryOnline").textContent = count;
      });

      socket.on("chat:msg", m => {
        if (!STATE.chat.some(x => x.id === m.id)) {
          STATE.chat.push(m);
          STATE.chat = STATE.chat.slice(-60);
          renderChat();
        }
      });

      socket.on("chat:clear", () => { STATE.chat = []; renderChat(); });

      ["match:new", "match:update", "match:remove", "giveaway:new", "giveaway:update", "giveaway:remove", "me:update"]
        .forEach(ev => socket.on(ev, scheduleRefresh));
    }

    async function refresh() {
      if (refreshing) return;

      refreshing = true;

      try {
        const state = await api("/api/state");
        STATE = { ...STATE, ...state };

        if (token) {
          try {
            ME = (await api("/api/me")).user;
          } catch (error) {
            if (error.status === 401) {
              token = "";
              ME = null;
              localStorage.removeItem("amp_token");
              if (socket) connectSocket();
            } else {
              throw error;
            }
          }
        } else {
          ME = null;
        }

        if (!booted) {
          booted = true;
          $("#boot").style.display = "none";
          connectSocket();
        }

        renderHeader();
        renderLobby();
        renderGiveaways();
        renderChat();

        $("#online").textContent = Number(STATE.online || 0) + " online";
        $("#summaryOnline").textContent = Number(STATE.online || 0);

        renderView();

        if (gridContext && $("#grid")) {
          const s = inventory().map(itemId).join(",");
          if (s !== gridSig) renderGrid();
        }
      } catch (error) {
        if (!booted) {
          $("#bootMessage").textContent = "Server connecting… Render may take some time to wake up.";
        }
      } finally {
        refreshing = false;
      }
    }

    setInterval(() => { if (!document.hidden) refresh(); }, 3000);

    setInterval(() => {
      const time = Date.now();

      document.querySelectorAll(".ticker-countdown").forEach(el => {
        const s = Math.ceil((Number(el.dataset.end) - time) / 1000);
        el.textContent = s > 0 ? s : "…";
      });

      document.querySelectorAll(".ticker-giveaway").forEach(el => {
        const s = Math.max(0, Math.ceil((Number(el.dataset.end) - time) / 1000));
        el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      });
    }, 250);

    function renderGrid() {

      const all = inventory();

      const items = all.filter(i => String(i.name || "").toLowerCase().includes(query));

      items.sort((a, b) => {

      $("#grid").innerHTML = items.map(item => {

        return `

            <h2>No Items!</h2>
            <p>Your inventory seems to be empty...</p>
            <button class="btn" data-action="deposit">Deposit Items</button>
          </div>`;
      } else if (!items.length) {
        $("#inventoryEmpty").innerHTML = '<div class="empty">No items match your search.</div>';
      } else {
        $("#inventoryEmpty").innerHTML = "";
      }

      gridSig = all.map(itemId).join(",");
      gridContext.info();
    }

    function bindGrid() {
      $("#gridSearch")?.addEventListener("input", renderGrid);
      $("#gridSort")?.addEventListener("change", renderGrid);
      renderGrid();
    }

    function pickItem(id) {
      if (!gridContext) return;

      if (selected.has(id)) {
        selected.delete(id);
      } else {
        if (selected.size >= gridContext.max) {
          return toast(`You can select up to ${gridContext.max} items`, "err");
        }

        selected.add(id);
      }

      renderGrid();
    }

    function selectAll() {
      if (!gridContext) return;

      selected.clear();

      for (const item of inventory()) {
        if (selected.size >= gridContext.max) break;
        selected.add(itemId(item));
      }

      renderGrid();
    }

    /* ---------- Wallet / Deposit / Bots ---------- */
    function showWallet() {
      if (!requireLogin()) return;

      selected = new Set();
      viewMatchId = null;

      gridContext = {
        max: 500,
        info() {
          const items = selectedItems();
          const btn = $("#withdrawButton");
          if (btn) btn.textContent = "Withdraw " + fmt(totalValue(items));
        }
      };

      openModal(`
        ${modalHeader("Inventory")}
        <div class="hint" style="margin:0 0 7px">Select Item</div>

        ${selectionGridHTML()}

        <div class="modal-footer">
          <button class="btn outline" data-action="select-all">Select All</button>
          <button class="btn" id="withdrawButton" data-action="withdraw">Withdraw 0</button>
        </div>`, "wide");

      bindGrid();
    }

    async function withdraw() {
      if (!requireLogin()) return;

      const uids = selectedUids();

      if (!uids.length) return toast("Select items first", "err");

      try {
        await api("/api/withdraw", { body: { uids } });

        closeModal();
        await refresh();
        openBotsModal(true);
      } catch (error) {
        fail(error);
      }
    }

    function showDeposit() {
      if (!requireLogin()) return;

      openModal2(`
        ${modalHeader("Deposit").replace('data-action="close"', 'data-action="close2"')}

        <div class="game-card" data-action="bots">
          <span class="pic">🐶🐝</span>
          <span>Adopt Me</span>
        </div>`);
    }

    function openBotsModal(claim) {
      const bot = STATE.bot || {};

      openModal2(`
        ${modalHeader("Adopt Me").replace('data-action="close"', 'data-action="close2"')}

        ${claim ? '<div class="claim">Join Our bots to claim your items</div>' : ""}

        <div class="warn">
          <i>!</i>
          <span>Always verify that the username of your trading partner matches exactly, users often impersonate bots with similar names.</span>
        </div>

        <div class="bot-row">
          <div class="bot-main">
            ${avatar({ username: bot.username || BOT_NAME, avatar: bot.avatar }, "sm")}
            <span>${esc(bot.username || BOT_NAME)}</span>
            <span class="dot"></span>
          </div>
          <button class="join" data-action="bot-join">Join</button>
        </div>

        <p class="hint">To initiate a trade with the bot, send the bot a trade request.</p>`);
    }

    /* ---------- Create / Join ---------- */
    function showCreate() {
      if (!requireLogin()) return;

      selected = new Set();
      createSide = "dog";
      viewMatchId = null;

      gridContext = {
        max: 8,
        info() {
          const items = selectedItems();
          const value = totalValue(items);
          const [low, high] = matchRange(value);
          const t = $("#createInfo");

          if (t) {
            t.innerHTML = items.length
              ? `${items.length}/8 · ${GEM}${fmt(value)} · Join ${fmt(low)} – ${fmt(high)}`
              : "Select up to 8 items";
          }
        }
      };

      openModal(`
        ${modalHeader("Create Coinflip")}

        <div class="sides" id="sides">
          <div class="side-choice selected" data-action="side" data-side="dog"><div>${chip("dog")}</div></div>
          <div class="side-choice" data-action="side" data-side="cat"><div>${chip("cat")}</div></div>
        </div>

        ${selectionGridHTML()}

        <div class="modal-footer">
          <span id="createInfo" style="margin-right:auto;align-self:center"></span>
          <button class="btn outline" data-action="select-all">Select All</button>
          <button class="btn gray" data-action="select-none">Clear</button>
          <button class="btn" data-action="submit-create">Create Game</button>
        </div>`, "wide");

      bindGrid();
    }

    async function submitCreate() {
      const uids = selectedUids();

      if (!uids.length) return toast("Select items first", "err");

      try {
        await api("/api/match/create", { body: { uids, side: createSide } });
        closeModal();
        toast("Game created!", "ok");
        await refresh();
      } catch (error) {
        fail(error);
      }
    }

    function showJoin(id) {
      if (!requireLogin()) return;

      const match = findMatch(id);

      if (!match || match.state !== "waiting") return toast("Match is no longer available", "err");

      selected = new Set();
      viewMatchId = null;

      const [low, high] = matchRange(Number(match.hostValue || 0));

      gridContext = {
        max: 8,
        info() {
          const value = totalValue(selectedItems());
          const valid = value >= low - 0.001 && value <= high + 0.001;
          const t = $("#joinInfo");

          if (t) {
            t.innerHTML = `Your bet ${GEM}${fmt(value)} · Need ${fmt(low)} – ${fmt(high)}`;
            t.style.color = valid ? "var(--green)" : "var(--red)";
          }
        }
      };

      openModal(`
        ${modalHeader("Join " + esc(getUsername(match.host)) + "'s Game")}

        <div class="row">
          <span class="hint" style="margin:0">Your coin:</span>
          <div style="width:44px;height:44px">${chip(match.joinSide)}</div>
        </div>

        ${selectionGridHTML()}

        <div class="modal-footer">
          <span id="joinInfo" style="margin-right:auto;align-self:center"></span>
          <button class="btn outline" data-action="select-all">Select All</button>
          <button class="btn gray" data-action="select-none">Clear</button>
          <button class="btn" data-action="submit-join" data-id="${esc(match.id)}">Join</button>
        </div>`, "wide");

      bindGrid();
    }

    async function submitJoin(id) {
      const uids = selectedUids();

      if (!uids.length) return toast("Select items first", "err");

      try {
        await api("/api/match/join", { body: { id, uids } });
        closeModal();
        await refresh();
        showView(id);
      } catch (error) {
        fail(error);
      }
    }

    /* ---------- Profile ---------- */
    function showPage(page) {
      $("#homePage").style.display = page === "home" ? "grid" : "none";
      $("#profilePage").style.display = page === "profile" ? "grid" : "none";
      window.scrollTo(0, 0);
    }

    async function showProfile(page = 1) {
      if (!requireLogin()) return;

      closeModal();
      showPage("profile");

      $("#profile").innerHTML = '<div class="card empty">Loading…</div>';

      try {
        const result = await api("/api/profile?page=" + encodeURIComponent(page));
        const stats = result.stats || {};
        const rows = asArray(result.rows);
        const pages = Number(result.pages || 1);
        const profit = Number(stats.profit || 0);

        $("#profile").innerHTML = `
          <div class="card profile-card enter">
            <div class="profile-head">
              ${avatar(ME, "lg")}

              <div style="flex:1">
                <h2>${esc(ME.username)}</h2>
                <span class="pill">${esc(ME.rank || "Rookie")}</span>
              </div>

              <button class="btn gray" data-action="home">← Back</button>
            </div>

            <div class="stats">
              <div class="stat"><small>Total Bet</small><b>${GEM}${fmt(stats.totalBet)}</b></div>
              <div class="stat"><small>Won</small><b>${GEM}${fmt(stats.totalWon)}</b></div>
              <div class="stat"><small>Profit</small><b class="${profit >= 0 ? "positive" : "negative"}">${profit >= 0 ? "+" : ""}${fmt(profit)}</b></div>
            </div>

            <div class="section-head">
              <h2>Transactions</h2>
              <button class="btn gray sm" data-action="history">Match History</button>
            </div>

            ${rows.length
              ? `<div class="table-wrap"><table>
                  <thead><tr><th>Type</th><th>Reference</th><th>Value</th><th>Date</th></tr></thead>
                  <tbody>
                    ${rows.map(r => `
                      <tr>
                        <td><b>${esc(r.type)}</b></td>
                        <td>${esc(r.id || "")}</td>
                        <td class="${Number(r.amount) < 0 ? "negative" : "positive"}">${fmt(r.amount)}</td>
                        <td>${r.ts ? esc(new Date(r.ts).toLocaleString()) : ""}</td>
                      </tr>`).join("")}
                  </tbody></table></div>`
              : '<div class="empty">No transactions yet</div>'}

            <div class="pagination">
              ${Array.from({ length: pages }, (_, i) => `
                <button class="${i + 1 === Number(result.page) ? "on" : ""}" data-action="profile-page" data-page="${i + 1}">${i + 1}</button>`).join("")}
            </div>
          </div>`;
      } catch (error) {
        fail(error);
        showPage("home");
      }
    }

    /* ---------- Admin (code comes from server after auth) ---------- */
    async function openAdmin() {
      if (!requireLogin()) return;

      try {
        const response = await fetch(API_BASE + "/api/admin/ui", {
          headers: { Authorization: "Bearer " + token }
        });

        if (!response.ok) throw new Error("Admin access denied");

        const script = await response.text();

        window.AMP = { api, esc, toast, fmt, tags };

        new Function(script)();
      } catch (error) {
        fail(error);
      }
    }

    /* ---------- Click router ---------- */
    const actions = {
      home() { closeModal(); closeModal2(); showPage("home"); },
      close: closeModal,
      close2: closeModal2,
      login: showLogin,
      "login-start": loginStart,
      "login-verify": loginVerify,
      logout,

      "user-menu"() { $("#userMenu")?.classList.toggle("open"); },

      profile() { showProfile(1); },
      "profile-page"(el) { showProfile(Number(el.dataset.page)); },
      admin: openAdmin,

      wallet: showWallet,
      deposit: showDeposit,
      bots() { openBotsModal(false); },
      "bot-join"() { window.open(BOT_LINK, "_blank", "noopener,noreferrer"); },
      withdraw,

      create: showCreate,
      "submit-create": submitCreate,

      side(el) {
        createSide = el.dataset.side;
        document.querySelectorAll("#sides .side-choice").forEach(s => s.classList.toggle("selected", s === el));
      },

      join(el) { closeModal(); showJoin(el.dataset.id); },
      "submit-join"(el) { submitJoin(el.dataset.id); },
      cancel(el) { cancelMatch(el.dataset.id); },
      view(el) { showView(el.dataset.id); },
      verify(el) { verifyMatch(el.dataset.id); },

      history: showHistory,
      replay(el) { startReplay(el.dataset.id); },
      "replay-again"(el) { startReplay(el.dataset.id); },
      "replay-back": showHistory,

      giveaway: showGiveaway,

      "giveaway-mode"(el) {
        giveawayMode = el.dataset.mode;
        document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b === el));
        renderGiveawayOptions();
      },

      "submit-giveaway": submitGiveaway,
      "enter-giveaway"(el) { enterGiveaway(el.dataset.id); },

      pick(el) { pickItem(el.dataset.id); },
      "select-all": selectAll,
      "select-none"() { selected.clear(); renderGrid(); },

      send: sendChat
    };

    document.addEventListener("click", event => {
      const el = event.target.closest("[data-action]");

      if (!event.target.closest(".user-menu-wrap")) {
        $("#userMenu")?.classList.remove("open");
      }

      if (!el) return;

      const action = actions[el.dataset.action];

      if (action) {
        if (el.dataset.action !== "user-menu") $("#userMenu")?.classList.remove("open");
        action(el, event);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;

      if ($("#overlay2").classList.contains("open")) closeModal2();
      else closeModal();
    });

    renderHeader();
    renderLobby();
    refresh();
  </script>
</body>
</html>
