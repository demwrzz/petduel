<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMP ROLL</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg: #101218;
      --header: #14161e;
      --panel: #191c25;
      --panel-2: #151820;
      --panel-3: #20242e;
      --border: #292d38;
      --muted: #8d909a;
      --text: #f6f7fb;
      --green: #00efa0;
      --green-dark: #00bb7b;
      --orange: #ffb52e;
      --red: #ff5968;
      --blue: #82aaff;

      /* Admin panel compatibility */
      --line: #292d38;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input,
    select {
      color: var(--text);
      outline: none;
    }

    a {
      color: inherit;
    }

    .app {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 28px;
      height: 76px;
      padding: 0 25px;
      border-bottom: 1px solid var(--border);
      background: var(--header);
    }

    .logo {
      flex: none;
      cursor: pointer;
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--green);
    }

    .nav {
      display: flex;
      flex: 1;
      align-items: center;
      height: 100%;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 16px;
      border-bottom: 3px solid var(--green);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wallet {
      display: flex;
      align-items: stretch;
      overflow: hidden;
      min-height: 43px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #20232c;
    }

    .wallet-main {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .wallet-main small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .wallet-main b {
      font-size: 14px;
    }

    .gem {
      color: var(--green);
      font-size: 22px;
    }

    .wallet-plus {
      width: 42px;
      color: #07120d;
      background: var(--green);
      font-size: 22px;
      font-weight: 800;
    }

    .user-menu-wrap {
      position: relative;
    }

    .user-button {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: #20232c;
      font-weight: 700;
    }

    .user-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 60;
      display: none;
      min-width: 200px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #20232c;
      box-shadow: 0 12px 30px #0008;
    }

    .user-menu.open {
      display: block;
    }

    .user-menu button {
      display: block;
      width: 100%;
      padding: 11px;
      border-radius: 5px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }

    .user-menu button:hover {
      background: #30343f;
    }

    .av {
      display: inline-grid;
      flex: none;
      place-items: center;
      width: 38px;
      height: 38px;
      overflow: hidden;
      border-radius: 50%;
      object-fit: cover;
      color: #fff;
      background: #3a4050;
      font-weight: 800;
    }

    .av.sm {
      width: 29px;
      height: 29px;
      font-size: 11px;
    }

    .av.lg {
      width: 72px;
      height: 72px;
      font-size: 24px;
    }

    .av.winner {
      box-shadow: 0 0 0 3px var(--orange);
    }

    /* BUTTONS */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 40px;
      padding: 0 17px;
      border-radius: 6px;
      color: #06130d;
      background: var(--green);
      font-weight: 800;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn.sm {
      min-height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }

    .btn.gray {
      border: 1px solid #414650;
      color: #d7d9e0;
      background: #292d37;
    }

    .btn.outline {
      border: 1px solid var(--green);
      color: var(--green);
      background: #17312c;
    }

    .btn.red {
      color: #fff;
      background: #d94453;
    }

    .btn.sun {
      color: #211500;
      background: var(--orange);
    }

    .btn.mint {
      color: #06130d;
      background: var(--green);
    }

    /* PAGE */

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      padding: 18px;
      flex: 1;
    }

    .content {
      min-width: 0;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 14px;
      padding: 18px 20px;
      border: 1px solid #8f681d;
      border-radius: 7px;
      background: linear-gradient(100deg, #30271d, #211f22);
    }

    .banner h1 {
      margin: 0 0 5px;
      color: var(--orange);
      font-size: 20px;
    }

    .banner p {
      margin: 0;
      color: #bab4a5;
      font-size: 13px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--border);
    }

    .summary div {
      padding: 15px;
      background: var(--panel);
    }

    .summary b {
      display: block;
      font-size: 19px;
    }

    .summary small {
      color: var(--muted);
      font-weight: 600;
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      flex: 1;
      margin: 0;
      font-size: 17px;
    }

    .pill {
      padding: 5px 9px;
      border-radius: 5px;
      color: var(--green);
      background: #15372d;
      font-size: 11px;
      font-weight: 800;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
    }

    /* MATCHES */

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match {
      display: grid;
      grid-template-columns: minmax(125px, 1fr) minmax(130px, 1.4fr)
        90px minmax(125px, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 92px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
    }

    .match.finished {
      border-color: #715322;
      background: #24221f;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .player-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .items {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
    }

    .item-thumb {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      overflow: hidden;
      border: 1px solid #353a45;
      border-radius: 6px;
      background: #222630;
    }

    .item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .match-middle {
      text-align: center;
    }

    .match-middle b {
      color: var(--green);
    }

    .match-middle small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .match-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .empty {
      padding: 50px 15px;
      color: var(--muted);
      text-align: center;
    }

    /* COIN */

    .coin-wrap {
      display: inline-block;
      perspective: 500px;
    }

    .coin {
      position: relative;
      width: 48px;
      height: 48px;
      transform-style: preserve-3d;
    }

    .coin.big {
      width: 95px;
      height: 95px;
    }

    .coin.cat {
      transform: rotateY(180deg);
    }

    .coin.spinning {
      animation: coin-spin .55s linear infinite;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 3px solid #b8811b;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe79a, #eaa821);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: 24px;
    }

    .coin.big .coin-face {
      font-size: 44px;
    }

    .coin-face.back {
      transform: rotateY(180deg);
    }

    @keyframes coin-spin {
      to {
        transform: rotateY(360deg);
      }
    }

    .countdown {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin: auto;
      border: 3px solid var(--orange);
      border-radius: 50%;
      color: var(--orange);
      font-size: 19px;
      font-weight: 800;
    }

    /* SIDEBAR / CHAT */

    .sidebar {
      position: sticky;
      top: 94px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: calc(100vh - 112px);
      min-height: 400px;
    }

    .giveaways {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .giveaway-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #6a5528;
      border-radius: 6px;
      background: #29251e;
    }

    .giveaway-card img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .giveaway-info {
      flex: 1;
      min-width: 0;
      color: #ddd3be;
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .giveaway-info b {
      color: #fff;
    }

    .chat {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
    }

    .online {
      color: var(--green);
      font-size: 11px;
    }

    .messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 13px;
      overflow-y: auto;
      padding: 14px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #c8cad1;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message b {
      color: #fff;
    }

    .rank {
      display: inline-block;
      margin-right: 3px;
      padding: 1px 5px;
      border-radius: 3px;
      color: #dce1e9;
      background: #444b59;
      font-size: 9px;
      font-weight: 800;
    }

    .rank.ADMIN {
      color: #fff;
      background: #d94453;
    }

    .rank.Whale {
      color: #211500;
      background: var(--orange);
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #373b46;
      border-radius: 5px;
      background: #11141b;
    }

    /* MODALS */

    .ov {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .76);
    }

    .ov.open {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 16px;
      border: 1px solid #292d37;
      border-radius: 7px;
      background: #14171f;
      box-shadow: 0 20px 70px #000a;
    }

    .modal.wide {
      width: min(1024px, 100%);
    }

    .mh {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mh h3 {
      flex: 1;
      margin: 0;
      font-size: 18px;
    }

    .x {
      width: 28px;
      height: 28px;
      color: #a4a6ae;
      background: transparent;
      font-size: 22px;
    }

    .hint {
      margin: 7px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .in,
    .row input:not([type="checkbox"]),
    .row select,
    .control {
      min-width: 0;
      padding: 12px;
      border: 2px solid #484b54;
      border-radius: 7px;
      color: var(--text);
      background: #14171f;
    }

    .in:focus,
    .row input:focus,
    .control:focus {
      border-color: var(--green);
    }

    .row input[type="text"] {
      flex: 1;
    }

    .inventory-tools {
      display: grid;
      grid-template-columns: minmax(150px, 2fr) minmax(130px, .9fr)
        minmax(140px, .9fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .inventory-box {
      min-height: 370px;
      padding: 16px;
      border-radius: 7px;
      background: #191c25;
    }

    .inventory-summary {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 15px;
    }

    .inventory-summary small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .inventory-summary b {
      font-size: 18px;
    }

    .inventory-plus {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: #04120b;
      background: var(--green);
      font-size: 19px;
      font-weight: 800;
    }

    .inventory-empty {
      display: flex;
      min-height: 260px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .inventory-empty h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .inventory-empty p {
      margin: 0 0 24px;
      color: #bfc1c9;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 8px;
      max-height: 390px;
      overflow-y: auto;
    }

    .inventory-item {
      position: relative;
      min-height: 150px;
      padding: 8px;
      border: 2px solid #30343e;
      border-radius: 6px;
      background: #20242e;
      text-align: center;
      cursor: pointer;
    }

    .inventory-item.selected {
      border-color: var(--green);
      background: #19372f;
    }

    .inventory-item img {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }

    .inventory-item .name {
      height: 30px;
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
    }

    .inventory-item .value {
      margin-top: 4px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .check {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 2px 5px;
      border-radius: 4px;
      color: #07120d;
      background: var(--green);
      font-weight: 800;
    }

    .tg {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin-top: 3px;
    }

    .tg i {
      padding: 1px 4px;
      border-radius: 3px;
      color: white;
      font-size: 9px;
      font-style: normal;
      font-weight: 800;
    }

    .tg .M { background: #a454da; }
    .tg .N { background: #1caac4; }
    .tg .F { background: #e56c9e; }
    .tg .R { background: #d38b22; }

    .modal-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .sides {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .side-choice {
      flex: 1;
      padding: 12px;
      border: 2px solid #343842;
      border-radius: 6px;
      background: #20242e;
      text-align: center;
      cursor: pointer;
      font-weight: 800;
    }

    .side-choice.selected {
      border-color: var(--green);
    }

    .side-choice span {
      display: block;
      margin-bottom: 5px;
      font-size: 30px;
    }

    .vs {
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      gap: 10px;
      align-items: start;
    }

    .vs-col {
      min-height: 180px;
      padding: 14px;
      border: 1px solid #343842;
      border-radius: 7px;
      background: #1c2029;
      text-align: center;
    }

    .vs-col.won {
      border-color: var(--orange);
    }

    .vs-col .items {
      justify-content: center;
      margin-top: 12px;
    }

    .vs-center {
      padding-top: 25px;
      text-align: center;
    }

    .fair {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      color: #a6aab5;
      background: #1b1e27;
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .fair code {
      color: #e5e7ec;
    }

    .seg {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
    }

    .seg button {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      color: #b6b8c0;
      background: #242832;
      font-weight: 700;
    }

    .seg button.on {
      color: #07120d;
      background: var(--green);
    }

    .game-card {
      width: 200px;
      overflow: hidden;
      border: 1px solid #3b404b;
      border-radius: 7px;
      background: #20242e;
      cursor: pointer;
      text-align: center;
    }

    .game-pic {
      display: grid;
      place-items: center;
      height: 130px;
      background: linear-gradient(135deg, #4c6973, #786b52);
      font-size: 58px;
    }

    .game-card b {
      display: block;
      padding: 12px;
    }

    .bot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #363b46;
      border-radius: 7px;
      background: #1d212a;
    }

    .bot-info {
      flex: 1;
    }

    .code {
      margin: 14px 0;
      padding: 16px;
      border: 1px dashed var(--green);
      border-radius: 6px;
      color: var(--green);
      background: #172a24;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      user-select: all;
    }

    /* PROFILE */

    .profile-card {
      padding: 18px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-head h2 {
      margin: 0 0 6px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #20242e;
    }

    .stat small {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .stat b {
      font-size: 20px;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--muted);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 14px;
    }

    .pagination button {
      min-width: 34px;
      height: 34px;
      border-radius: 5px;
      color: #fff;
      background: #30343e;
    }

    .pagination button.on {
      color: #06130d;
      background: var(--green);
    }

    /* TOAST / LOADING */

    .toasts {
      position: fixed;
      top: 88px;
      right: 16px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      max-width: 320px;
      padding: 12px 15px;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      background: #252a34;
      box-shadow: 0 8px 25px #0008;
    }

    .toast.err {
      background: #9e303d;
    }

    .toast.ok {
      color: #04120b;
      background: var(--green);
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      background: #11141b;
      text-align: center;
      font-weight: 700;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #323844;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Admin UI returned by server */

    #adm .modal {
      color: var(--text);
      background: #14171f;
    }

    #adm [style*="background:#f5faff"] {
      background: #20242e !important;
    }

    #adm [style*="border:2px solid #e0edfb"] {
      border-color: #343842 !important;
    }

    #adm [style*="border-bottom:1px solid #e0edfb"] {
      border-color: #343842 !important;
    }

    @media (max-width: 1050px) {
      .main {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: 480px;
      }

      .match {
        grid-template-columns: 1fr 1fr;
      }

      .match .items,
      .match-middle,
      .match-actions {
        grid-column: 1 / -1;
      }

      .match-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        flex-wrap: wrap;
        height: auto;
        min-height: 70px;
        gap: 8px;
        padding: 10px;
      }

      .logo {
        font-size: 21px;
      }

      .nav {
        display: none;
      }

      .header-right {
        margin-left: auto;
      }

      .user-name {
        max-width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .main {
        padding: 10px;
      }

      .summary,
      .stats {
        grid-template-columns: 1fr;
      }

      .inventory-tools {
        grid-template-columns: 1fr;
      }

      .vs {
        grid-template-columns: 1fr;
      }

      .modal {
        max-height: 94vh;
      }
    }
  </style>
</head>

<body>
  <div id="boot">
    <div class="loader"></div>
    <div id="bootMessage">Connecting to AMP ROLL…</div>
    <button class="btn gray" onclick="location.reload()">Retry</button>
  </div>

  <div class="toasts" id="toasts"></div>

  <div class="ov" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="logo" data-action="home">AMP<span>ROLL</span></div>

      <nav class="nav">
        <div class="nav-item" data-action="home">🪙 Coinflip</div>
      </nav>

      <div class="header-right" id="headerRight"></div>
    </header>

    <main class="main" id="homePage">
      <section class="content">
        <div class="banner">
          <div>
            <h1>AMP ROLL Coinflip</h1>
            <p>Create a match, pick a side and watch the coin flip.</p>
          </div>

          <span style="font-size:34px">🐶 🐱</span>
        </div>

        <div class="summary">
          <div>
            <b id="summaryGames">0</b>
            <small>Live Games</small>
          </div>

          <div>
            <b id="summaryValue">0</b>
            <small>Total Lobby Value</small>
          </div>

          <div>
            <b id="summaryOnline">0</b>
            <small>Players Online</small>
          </div>
        </div>

        <div class="section-head">
          <h2>COINFLIP GAMES</h2>
          <span class="pill" id="gameCount">0 GAMES</span>
          <button class="btn gray" data-action="history">History</button>
          <button class="btn" data-action="create">+ Create Game</button>
        </div>

        <div class="match-list" id="lobby"></div>
      </section>

      <aside class="sidebar">
        <div class="giveaways" id="giveaways"></div>

        <div class="chat">
          <div class="chat-head">
            <span>💬 LIVE CHAT</span>
            <span class="online" id="online">Connecting…</span>
          </div>

          <div class="messages" id="messages"></div>

          <div class="chat-input">
            <input
              id="chatInput"
              maxlength="160"
              placeholder="Type a message..."
            >
            <button class="btn sm" data-action="send">Send</button>
          </div>
        </div>
      </aside>
    </main>

    <main
      class="main"
      id="profilePage"
      style="display:none;grid-template-columns:1fr"
    >
      <div id="profile"></div>
    </main>
  </div>

  <script>
    "use strict";

    /*
      Frontend ve backend aynı Render servisindedir.
      URL otomatik olarak mevcut siteden alınır.
    */
    const API_BASE = window.location.origin;

    const BOT_NAME = "DedokAmp";

    const BOT_LINK =
      "https://www.roblox.com/share?code=a0dd8a7bc68f034b99e078f454d4e903&type=Server";

    const $ = selector => document.querySelector(selector);

    const esc = value => String(value ?? "").replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]
    );

    const fmt = value => Number(value || 0).toLocaleString(
      "en-US",
      { maximumFractionDigits: 2 }
    );

    const asArray = value => Array.isArray(value) ? value : [];

    const getUsername = user => {
      if (!user) return "";
      if (typeof user === "string") return user;
      return user.username || user.name || "";
    };

    const sideIcon = side => side === "cat" ? "🐱" : "🐶";

    let token = localStorage.getItem("amp_token") || "";
    let ME = null;

    let STATE = {
      matches: [],
      giveaways: [],
      chat: [],
      bot: null,
      online: 0,
      config: {
        range: 0.10
      }
    };

    let socket = null;
    let booted = false;
    let refreshing = false;
    let refreshTimer = null;

    let selected = new Set();
    let gridContext = null;
    let viewMatchId = null;
    let loginData = null;
    let createSide = "dog";
    let giveawayMode = "easy";

    /* API */

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json"
      };

      if (token) {
        headers.Authorization = "Bearer " + token;
      }

      const response = await fetch(API_BASE + path, {
        method: options.method || (options.body ? "POST" : "GET"),
        headers,
        body: options.body
          ? JSON.stringify(options.body)
          : undefined
      });

      const text = await response.text();

      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { message: text };
      }

      if (!response.ok) {
        const error = new Error(
          data.error || data.message || `HTTP ${response.status}`
        );

        error.status = response.status;
        throw error;
      }

      return data;
    }

    function toast(message, type = "") {
      const element = document.createElement("div");

      element.className = "toast " + type;
      element.textContent = message;

      $("#toasts").appendChild(element);

      setTimeout(() => element.remove(), 4000);
    }

    function fail(error) {
      toast(error.message || String(error), "err");
    }

    /* HELPERS */

    function avatar(user, size = "", winner = false) {
      const name = getUsername(user) || "?";
      const image = user && (user.avatar || user.avatarUrl);

      if (image) {
        return `
          <img
            class="av ${size} ${winner ? "winner" : ""}"
            src="${esc(image)}"
            alt=""
          >
        `;
      }

      return `
        <span class="av ${size} ${winner ? "winner" : ""}">
          ${esc(name.charAt(0).toUpperCase())}
        </span>
      `;
    }

    function tags(item) {
      let result = "";

      if (item.age === "mega" || item.mega) {
        result += '<i class="M">M</i>';
      }

      if (item.age === "neon" || item.neon) {
        result += '<i class="N">N</i>';
      }

      if (item.fly) {
        result += '<i class="F">F</i>';
      }

      if (item.ride) {
        result += '<i class="R">R</i>';
      }

      return result ? `<div class="tg">${result}</div>` : "";
    }

    function itemId(item) {
      return String(item.uid || item.id || item.catalogId || "");
    }

    function itemImage(item) {
      return item.image || item.imageUrl || "";
    }

    function inventory() {
      return ME ? asArray(ME.inventory) : [];
    }

    function totalValue(items) {
      return items.reduce(
        (total, item) => total + Number(item.value || 0),
        0
      );
    }

    function selectedItems() {
      return inventory().filter(item => selected.has(itemId(item)));
    }

    function selectedUids() {
      return selectedItems().map(itemId);
    }

    function matchRange(value) {
      const tolerance = Number(STATE.config?.range ?? 0.10);

      return [
        value * (1 - tolerance),
        value * (1 + tolerance)
      ];
    }

    function thumbs(items, max = 6) {
      const array = asArray(items);

      let result = array.slice(0, max).map(item => `
        <div
          class="item-thumb"
          title="${esc(item.name)} • ${fmt(item.value)}"
        >
          <img src="${esc(itemImage(item))}" alt="">
        </div>
      `).join("");

      if (array.length > max) {
        result += `
          <div class="item-thumb">
            <b>+${array.length - max}</b>
          </div>
        `;
      }

      return result;
    }

    function requireLogin() {
      if (ME) return true;

      showLogin();
      return false;
    }

    /* MODAL */

    function modalHeader(title) {
      return `
        <div class="mh">
          <h3>${title}</h3>
          <button class="x" data-action="close">×</button>
        </div>
      `;
    }

    function openModal(html, wide = false) {
      const modal = $("#modal");

      modal.className = "modal" + (wide ? " wide" : "");
      modal.innerHTML = html;

      $("#overlay").classList.add("open");
    }

    function closeModal() {
      $("#overlay").classList.remove("open");
      selected.clear();
      gridContext = null;
      viewMatchId = null;
    }

    $("#overlay").addEventListener("mousedown", event => {
      if (event.target.id === "overlay") {
        closeModal();
      }
    });

    /* HEADER */

    function renderHeader() {
      const target = $("#headerRight");

      if (!ME) {
        target.innerHTML = `
          <button class="btn" data-action="login">
            Login with Roblox
          </button>
        `;

        return;
      }

      const menuWasOpen =
        $("#userMenu") && $("#userMenu").classList.contains("open");

      target.innerHTML = `
        <div class="wallet">
          <div class="wallet-main" data-action="wallet">
            <span class="gem">💎</span>
            <div>
              <small>Adopt Me</small>
              <b>${fmt(totalValue(inventory()))}</b>
            </div>
          </div>

          <button class="wallet-plus" data-action="deposit">+</button>
        </div>

        <div class="user-menu-wrap">
          <button class="user-button" data-action="user-menu">
            ${avatar(ME, "sm")}
            <span class="user-name">${esc(ME.username)}</span>
            ▾
          </button>

          <div class="user-menu ${menuWasOpen ? "open" : ""}" id="userMenu">
            <button data-action="profile">👤 Profile</button>
            <button data-action="giveaway">🎁 Create Giveaway</button>

            ${ME.isAdmin
              ? '<button data-action="admin">🛠 Admin Panel</button>'
              : ""}

            <button data-action="logout">🚪 Logout</button>
          </div>
        </div>
      `;
    }

    /* MATCHES */

    function findMatch(id) {
      return asArray(STATE.matches).find(match => match.id === id);
    }

    function coinHTML(side = "dog", spinning = false, big = false) {
      return `
        <div class="coin-wrap">
          <div class="coin ${big ? "big" : ""} ${spinning ? "spinning" : side === "cat" ? "cat" : ""}">
            <div class="coin-face">🐶</div>
            <div class="coin-face back">🐱</div>
          </div>
        </div>
      `;
    }

    function countdownHTML(end, big = false) {
      return `
        <div
          class="countdown ticker-countdown"
          data-end="${Number(end || 0)}"
          ${big ? 'style="width:80px;height:80px;font-size:32px"' : ""}
        >
          3
        </div>
      `;
    }

    function renderLobby() {
      const matches = asArray(STATE.matches)
        .filter(match => match.state !== "cancelled")
        .slice()
        .sort((a, b) => {
          const completed =
            Number(a.state === "finished") -
            Number(b.state === "finished");

          return completed || Number(b.hostValue) - Number(a.hostValue);
        });

      $("#summaryGames").textContent = matches.length;
      $("#gameCount").textContent = matches.length + " GAMES";

      const lobbyValue = matches.reduce(
        (sum, match) =>
          sum +
          Number(match.hostValue || 0) +
          Number(match.oppValue || 0),
        0
      );

      $("#summaryValue").textContent = fmt(lobbyValue);

      if (!matches.length) {
        $("#lobby").innerHTML = `
          <div class="card empty">
            No games right now.<br>
            Create the first coinflip!
          </div>
        `;

        return;
      }

      $("#lobby").innerHTML = matches.map(match => {
        const finished = match.state === "finished";
        const mine = ME && match.host?.id === ME.id;
        const hostWon = finished && match.winnerId === match.host?.id;

        const [low, high] = matchRange(Number(match.hostValue || 0));

        let middle = "";

        if (match.state === "waiting") {
          middle = `
            <b>💎 ${fmt(match.hostValue)}</b>
            <small>${fmt(low)} – ${fmt(high)}</small>
          `;
        } else if (match.state === "countdown") {
          middle = countdownHTML(match.countdownEnd);
        } else if (match.state === "flipping") {
          middle = coinHTML("dog", true);
        } else {
          middle = `
            ${coinHTML(match.winnerSide)}
            <small>
              💎 ${fmt(
                Number(match.hostValue || 0) +
                Number(match.oppValue || 0)
              )}
            </small>
          `;
        }

        const opponent = match.joiner
          ? `
            <div class="player">
              ${avatar(match.joiner, "", finished && !hostWon)}
              <div style="min-width:0">
                <div class="player-name">
                  ${esc(getUsername(match.joiner))}
                </div>
                <small>${sideIcon(match.joinSide)} ${esc(match.joinSide)}</small>
              </div>
            </div>
          `
          : `
            <div class="player" style="color:var(--muted)">
              Waiting for player…
            </div>
          `;

        let action = "";

        if (match.state === "waiting") {
          action = mine
            ? `
              <button
                class="btn red sm"
                data-action="cancel"
                data-id="${esc(match.id)}"
              >
                Cancel
              </button>
            `
            : `
              <button
                class="btn sm"
                data-action="join"
                data-id="${esc(match.id)}"
              >
                Join
              </button>
            `;
        }

        return `
          <div class="match ${finished ? "finished" : ""}">
            <div class="player">
              ${avatar(match.host, "", finished && hostWon)}
              <div style="min-width:0">
                <div class="player-name">
                  ${esc(getUsername(match.host))}
                </div>
                <small>${sideIcon(match.hostSide)} ${esc(match.hostSide)}</small>
              </div>
            </div>

            <div class="items">
              ${thumbs(match.hostItems)}
            </div>

            <div class="match-middle">${middle}</div>

            ${opponent}

            <div class="match-actions">
              ${action}
              <button
                class="btn gray sm"
                data-action="view"
                data-id="${esc(match.id)}"
              >
                View
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function showView(id) {
      gridContext = null;
      viewMatchId = id;

      openModal("", true);
      renderView();
    }

    function renderView() {
      if (!viewMatchId || !$("#overlay").classList.contains("open")) {
        return;
      }

      const match = findMatch(viewMatchId);

      if (!match) {
        $("#modal").innerHTML = `
          ${modalHeader("Match")}
          <div class="empty">This match is no longer in the lobby.</div>
        `;

        return;
      }

      const finished = match.state === "finished";
      const hostWon = finished && match.winnerId === match.host?.id;
      const mine = ME && match.host?.id === ME.id;

      let middle;

      if (match.state === "countdown") {
        middle = countdownHTML(match.countdownEnd, true);
      } else if (match.state === "flipping") {
        middle = coinHTML("dog", true, true);
      } else if (finished) {
        middle = coinHTML(match.winnerSide, false, true);
      } else {
        middle = `
          <b style="font-size:28px;color:var(--muted)">VS</b>
        `;
      }

      function playerColumn(user, items, side, won) {
        if (!user) {
          return `
            <div class="vs-col">
              <div class="empty">Waiting for opponent…</div>
            </div>
          `;
        }

        return `
          <div class="vs-col ${won ? "won" : ""}">
            ${avatar(user, "lg", won)}
            <div style="margin-top:10px">
              <b>${esc(getUsername(user))}</b>
              ${sideIcon(side)}
            </div>
            <div class="hint">💎 ${fmt(totalValue(asArray(items)))}</div>
            <div class="items">${thumbs(items, 10)}</div>
          </div>
        `;
      }

      let action = "";

      if (match.state === "waiting") {
        action = mine
          ? `
            <button
              class="btn red"
              data-action="cancel"
              data-id="${esc(match.id)}"
            >
              Cancel Match
            </button>
          `
          : `
            <button
              class="btn"
              data-action="join"
              data-id="${esc(match.id)}"
            >
              Join Match
            </button>
          `;
      }

      $("#modal").innerHTML = `
        ${modalHeader("Coinflip Match")}

        <div class="vs">
          ${playerColumn(
            match.host,
            match.hostItems,
            match.hostSide,
            finished && hostWon
          )}

          <div class="vs-center">
            ${middle}
            ${finished
              ? `<div class="hint"><b>${esc(getUsername(match.winner))}</b> wins!</div>`
              : ""}
          </div>

          ${playerColumn(
            match.joiner,
            match.joinerItems,
            match.joinSide,
            finished && !hostWon
          )}
        </div>

        <div class="modal-footer">${action}</div>

        <div class="fair">
          <b>Result verification</b><br>
          Hash: <code>${esc(match.hash || "—")}</code><br>

          ${finished && match.seed
            ? `
              Seed: <code>${esc(match.seed)}</code><br>
              <button
                class="btn gray sm"
                style="margin-top:8px"
                data-action="verify"
                data-id="${esc(match.id)}"
              >
                Verify
              </button>
              <span id="verifyResult"></span>
            `
            : "Seed is revealed when the match ends."
          }
        </div>
      `;
    }

    async function verifyMatch(id) {
      const match = findMatch(id);

      if (!match || !match.seed) return;

      try {
        const encoder = new TextEncoder();

        const toHex = buffer => Array.from(new Uint8Array(buffer))
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join("");

        const hash = toHex(
          await crypto.subtle.digest(
            "SHA-256",
            encoder.encode(match.seed)
          )
        );

        const key = await crypto.subtle.importKey(
          "raw",
          encoder.encode(match.seed),
          { name: "HMAC", hash: "SHA-256" },
          false,
          ["sign"]
        );

        const signature = toHex(
          await crypto.subtle.sign(
            "HMAC",
            key,
            encoder.encode(String(match.id))
          )
        );

        const roll =
          parseInt(signature.slice(0, 8), 16) / 4294967296;

        const result = roll < 0.5 ? "dog" : "cat";

        const valid =
          hash === match.hash &&
          result === match.winnerSide;

        const target = $("#verifyResult");

        if (target) {
          target.innerHTML = valid
            ? `<b class="positive"> ✔ Hash and result match: ${sideIcon(result)} ${result}</b>`
            : '<b class="negative"> ✘ Hash or result mismatch</b>';
        }
      } catch (error) {
        fail(error);
      }
    }

    async function cancelMatch(id) {
      if (!confirm("Cancel this match and return the items?")) return;

      try {
        await api("/api/match/cancel", {
          body: { id }
        });

        closeModal();
        toast("Match cancelled. Items returned.", "ok");
        await refresh();
      } catch (error) {
        fail(error);
      }
    }

    /* GIVEAWAYS */

    function renderGiveaways() {
      $("#giveaways").innerHTML = asArray(STATE.giveaways).map(g => `
        <div class="giveaway-card">
          ${asArray(g.items).slice(0, 1).map(item => `
            <img src="${esc(itemImage(item))}" alt="">
          `).join("")}

          <div class="giveaway-info">
            <b>🎁 ${esc(getUsername(g.host))}'s Giveaway</b><br>
            💎 ${fmt(g.value)} · ${Number(g.entrantCount || 0)} entered<br>
            Ends in
            <span class="ticker-giveaway" data-end="${Number(g.endsAt || 0)}"></span>
          </div>

          <button
            class="btn sm"
            data-action="enter-giveaway"
            data-id="${esc(g.id)}"
          >
            Enter
          </button>
        </div>
      `).join("");
    }

    function showGiveaway() {
      if (!requireLogin()) return;

      selected = new Set();
      giveawayMode = "easy";
      viewMatchId = null;

      gridContext = {
        max: 5,
        info() {
          const target = $("#giveawayInfo");
          const items = selectedItems();

          if (target) {
            target.textContent =
              `${items.length}/5 selected · 💎 ${fmt(totalValue(items))}`;
          }
        }
      };

      openModal(`
        ${modalHeader("Create Giveaway")}

        <div class="seg">
          <button
            class="on"
            data-action="giveaway-mode"
            data-mode="easy"
          >
            Easy
          </button>

    function chatMessage(message) {

    function renderChat() {
      const target = $("#messages");

      const nearBottom =
        target.scrollHeight - target.scrollTop - target.clientHeight < 80;

      target.innerHTML = asArray(STATE.chat)
        .slice(-60)
        .map(chatMessage)
        .join("");

      if (nearBottom) {
        target.scrollTop = target.scrollHeight;
      }
    }

    function sendChat() {
      if (!requireLogin()) return;

      const input = $("#chatInput");
      const text = input.value.trim();

      if (!text) return;

      if (!socket || !socket.connected) {
        return toast("Chat is connecting", "err");
      }

      socket.emit("chat:send", { text }, response => {
        if (response && response.error) {
          toast(response.error, "err");
          return;
        }

        input.value = "";
      });
    }

    $("#chatInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        sendChat();
      }
    });

    /* LIVE DATA */

    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, 150);
    }

    function connectSocket() {
      if (typeof io !== "function") {
        toast("Live connection unavailable", "err");
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      socket = io(API_BASE, {
        auth: { token }
      });

      socket.on("connect", scheduleRefresh);

      socket.on("disconnect", () => {
        $("#online").textContent = "Connecting…";
      });

      socket.on("online", count => {
        $("#online").textContent = count + " online";
        $("#summaryOnline").textContent = count;
      });

      socket.on("chat:msg", message => {
        if (!STATE.chat.some(item => item.id === message.id)) {
          STATE.chat.push(message);
          STATE.chat = STATE.chat.slice(-60);
          renderChat();
        }
      });

      socket.on("chat:clear", () => {
        STATE.chat = [];
        renderChat();
      });

      [
        "match:new",
        "match:update",
        "match:remove",
        "giveaway:new",
        "giveaway:update",
        "giveaway:remove",
        "me:update"
      ].forEach(event => {
        socket.on(event, scheduleRefresh);
      });
    }

    async function refresh() {
      if (refreshing) return;

      refreshing = true;

      try {
        const state = await api("/api/state");

        STATE = {
          ...STATE,
          ...state
        };

        if (token) {
          try {
            const result = await api("/api/me");
            ME = result.user;
          } catch (error) {
            if (error.status === 401) {
              token = "";
              ME = null;
              localStorage.removeItem("amp_token");

              if (socket) {
                connectSocket();
              }
            } else {
              throw error;
            }
          }
        } else {
          ME = null;
        }

        if (!booted) {
          booted = true;
          $("#boot").style.display = "none";
          connectSocket();
        }

        renderHeader();
        renderLobby();
        renderGiveaways();
        renderChat();

        $("#online").textContent = Number(STATE.online || 0) + " online";
        $("#summaryOnline").textContent = Number(STATE.online || 0);

        if (viewMatchId) {
          renderView();
        }

        if (gridContext && $("#grid")) {
          renderGrid();
        }
      } catch (error) {
        if (!booted) {
          $("#bootMessage").textContent =
            "Server connecting… Render may take some time to wake up.";
        }
      } finally {
        refreshing = false;
      }
    }

    setInterval(() => {
      if (!document.hidden) {
        refresh();
      }
    }, 3000);

    setInterval(() => {
      const time = Date.now();

      document.querySelectorAll(".ticker-countdown").forEach(element => {
        const seconds = Math.ceil(
          (Number(element.dataset.end) - time) / 1000
        );

        element.textContent = seconds > 0 ? seconds : "…";
      });

      document.querySelectorAll(".ticker-giveaway").forEach(element => {
        const seconds = Math.max(
          0,
          Math.ceil((Number(element.dataset.end) - time) / 1000)
        );

        element.textContent =
          Math.floor(seconds / 60) +
          ":" +
          String(seconds % 60).padStart(2, "0");
      });
    }, 250);

    function renderGrid() {
      if (!gridContext || !$("#grid")) return;

      const query = ($("#gridSearch")?.value || "").toLowerCase();
      const sort = $("#gridSort")?.value || "value-desc";

      const allItems = inventory();

      const items = allItems.filter(item =>
        String(item.name || "").toLowerCase().includes(query)
      );

      items.sort((a, b) => {
        if (sort === "value-asc") {
          return Number(a.value || 0) - Number(b.value || 0);
        }

        if (sort === "name") {
          return String(a.name || "").localeCompare(String(b.name || ""));
        }

        return Number(b.value || 0) - Number(a.value || 0);
      });

      $("#inventoryWorth").textContent = fmt(totalValue(allItems));
      $("#inventoryCount").textContent = allItems.length;

      $("#grid").innerHTML = items.map(item => {
        const id = itemId(item);
        const checked = selected.has(id);

        return `
          <div
            class="inventory-item ${checked ? "selected" : ""}"
            data-action="pick"
            data-id="${esc(id)}"
          >
            ${checked ? '<span class="check">✓</span>' : ""}
            <img src="${esc(itemImage(item))}" alt="">
            <div class="name">${esc(item.name)}</div>
            <div class="value">💎 ${fmt(item.value)}</div>
            ${tags(item)}
          </div>
        `;
      }).join("");

      if (!allItems.length) {
        $("#inventoryEmpty").innerHTML = `
          <div class="inventory-empty">
            <h2>No Items!</h2>
            <p>Your inventory seems to be empty...</p>
            <button class="btn" data-action="deposit">
              Deposit Items
            </button>
          </div>
        `;
      } else if (!items.length) {
        $("#inventoryEmpty").innerHTML = `
          <div class="empty">No items match your search.</div>
        `;
      } else {
        $("#inventoryEmpty").innerHTML = "";
      }

      gridContext.info();
    }

    function bindGrid() {
      $("#gridSearch")?.addEventListener("input", renderGrid);
      $("#gridSort")?.addEventListener("change", renderGrid);
      renderGrid();
    }

    function pickItem(id) {
      if (!gridContext) return;

      if (selected.has(id)) {
        selected.delete(id);
      } else {
        if (selected.size >= gridContext.max) {
          return toast(
            `You can select up to ${gridContext.max} items`,
            "err"
          );
        }

        selected.add(id);
      }

      renderGrid();
    }

    function selectAll() {
      if (!gridContext) return;

      selected.clear();

      for (const item of inventory()) {
        if (selected.size >= gridContext.max) break;
        selected.add(itemId(item));
      }

      renderGrid();
    }

                <button
                  class="${index + 1 === Number(result.page) ? "on" : ""}"
                  data-action="profile-page"
                  data-page="${index + 1}"
                >
                  ${index + 1}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      } catch (error) {
        fail(error);
        showPage("home");
      }
    }

    /* ADMIN */

    async function openAdmin() {
      if (!requireLogin()) return;

      try {
        const response = await fetch(API_BASE + "/api/admin/ui", {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        if (!response.ok) {
          throw new Error("Admin access denied");
        }

        const script = await response.text();

        window.AMP = {
          api,
          esc,
          toast,
          fmt,
          tags
        };

        new Function(script)();
      } catch (error) {
        fail(error);
      }
    }

    /* CLICK ROUTER */

    const actions = {
      home() {
        closeModal();
        showPage("home");
      },

      close: closeModal,
      login: showLogin,
      "login-start": loginStart,
      "login-verify": loginVerify,
      logout,

      "user-menu"() {
        $("#userMenu")?.classList.toggle("open");
      },

      profile() {
        showProfile(1);
      },

      "profile-page"(element) {
        showProfile(Number(element.dataset.page));
      },

      admin: openAdmin,

      wallet: showWallet,
      deposit: showDeposit,
      bots: showBots,

      "bot-join"() {
        window.open(BOT_LINK, "_blank", "noopener,noreferrer");
      },

      withdraw,

      create: showCreate,
      "submit-create": submitCreate,

      side(element) {
        createSide = element.dataset.side;

        document.querySelectorAll("#sides .side-choice").forEach(choice => {
          choice.classList.toggle("selected", choice === element);
        });
      },

      join(element) {
        showJoin(element.dataset.id);
      },

      "submit-join"(element) {
        submitJoin(element.dataset.id);
      },

      cancel(element) {
        cancelMatch(element.dataset.id);
      },

      view(element) {
        showView(element.dataset.id);
      },

      verify(element) {
        verifyMatch(element.dataset.id);
      },

      history: showHistory,

      giveaway: showGiveaway,

      "giveaway-mode"(element) {
        giveawayMode = element.dataset.mode;

        document.querySelectorAll(".seg button").forEach(button => {
          button.classList.toggle("on", button === element);
        });

        renderGiveawayOptions();
      },

      "submit-giveaway": submitGiveaway,

      "enter-giveaway"(element) {
        enterGiveaway(element.dataset.id);
      },

      pick(element) {
        pickItem(element.dataset.id);
      },

      "select-all": selectAll,

      "select-none"() {
        selected.clear();
        renderGrid();
      },

      send: sendChat
    };

    document.addEventListener("click", event => {
      const element = event.target.closest("[data-action]");

      if (!event.target.closest(".user-menu-wrap")) {
        $("#userMenu")?.classList.remove("open");
      }

      if (!element) return;

      const action = actions[element.dataset.action];

      if (action) {
        if (element.dataset.action !== "user-menu") {
          $("#userMenu")?.classList.remove("open");
        }

        action(element, event);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal();
      }
    });

    renderHeader();
    renderLobby();
    refresh();
  </script>
</body>
</html>
