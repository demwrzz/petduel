<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMP ROLL</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root{--blue:#2f9bff;--blue2:#1b7fe0;--sun:#ffc83d;--pink:#ff7eb6;--mint:#3fcf9f;--red:#ff5c6c;--ink:#23324d;--mut:#6b7a99;--line:#e0edfb;--card:#fff;--orange:#ff9f1c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:
radial-gradient(600px 200px at 10% 0,#fff 0,transparent 70%),radial-gradient(500px 180px at 80% 8%,#fff 0,transparent 70%),
linear-gradient(#bfe6ff,#eaf7ff 45%,#fff7e0) fixed;font-size:15px}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;font-size:14px;color:var(--ink)}
.app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:18px;padding:10px 22px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(47,155,255,.18)}
.logo{font-weight:700;font-size:26px;letter-spacing:1px;cursor:pointer;background:linear-gradient(90deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-size:20px}
nav{display:flex;gap:6px;flex:1}
nav a{padding:8px 16px;border-radius:12px;font-weight:600;color:var(--mut);cursor:pointer}
nav a.on{background:#e6f3ff;color:var(--blue2)}
.right{display:flex;align-items:center;gap:12px}
.wallet{display:flex;align-items:center;background:#f2f9ff;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.wallet .w{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer}
.wallet small{display:block;font-size:11px;color:var(--mut);line-height:1}
.wallet b{font-size:16px;line-height:1.1}
.wallet .plus{background:var(--mint);color:#fff;font-size:22px;font-weight:700;width:40px;align-self:stretch}
.btn{padding:9px 18px;border-radius:12px;font-weight:600;font-size:14px;color:#fff;background:var(--blue);box-shadow:0 3px 0 var(--blue2);transition:.1s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue2)}
.btn.sun{background:var(--sun);color:#6a4a00;box-shadow:0 3px 0 #e0a800}
.btn.mint{background:var(--mint);box-shadow:0 3px 0 #2aa57c}
.btn.red{background:var(--red);box-shadow:0 3px 0 #d63d4e}
.btn.gray{background:#e7eefa;color:var(--ink);box-shadow:0 3px 0 #cbd7ec}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.user{position:relative}
.user>button{display:flex;align-items:center;gap:8px;background:#f2f9ff;border:2px solid var(--line);border-radius:14px;padding:5px 12px 5px 6px;font-weight:600;color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(35,50,77,.2);min-width:190px;padding:6px;display:none;z-index:60}
.menu.open{display:block}
.menu a{display:block;padding:10px 12px;border-radius:10px;font-weight:500;cursor:pointer}
.menu a:hover{background:#eaf5ff}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none}
.av.lg{width:64px;height:64px;font-size:26px}.av.sm{width:26px;height:26px;font-size:12px}
.ring{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--orange);}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 22px;max-width:1500px;margin:0 auto;width:100%;flex:1;align-items:start}
.card{background:var(--card);border-radius:20px;box-shadow:0 6px 22px rgba(47,155,255,.14);padding:16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{font-size:20px;flex:1}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#e6f3ff;color:var(--blue2)}
.side{position:sticky;top:76px;height:calc(100vh - 92px);display:flex;flex-direction:column;gap:12px;min-height:0}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;word-break:break-word}
.msg b{font-weight:600}
.rk{font-size:10px;padding:1px 6px;border-radius:6px;color:#fff;margin-right:4px;font-weight:600;background:#9fb3d1}
.rk.Roller{background:var(--blue)}.rk.Highroller{background:var(--pink)}.rk.Whale{background:var(--orange)}.rk.ADMIN{background:var(--red)}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input{flex:1;border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:0}
.cin input:focus{border-color:var(--blue)}
.gw{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:linear-gradient(135deg,#fff3c9,#ffe4f1);border:2px solid #ffe08a}
.gw .im{display:flex;gap:2px}
.gw img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:10px}
.gw .inf{flex:1;font-size:12.5px;line-height:1.3}
.match{display:grid;grid-template-columns:150px minmax(0,1fr) 110px 150px 150px;gap:10px;align-items:center;padding:12px;border-radius:18px;border:2px solid var(--line);background:#fbfdff;margin-bottom:10px}
.match.fin{border-color:#ffd9a0;background:#fffaf0}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl span.n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-ico{font-size:18px}
.items{display:flex;gap:4px;flex-wrap:wrap}
.it{position:relative;width:46px;height:46px;border-radius:12px;background:#fff;border:2px solid var(--line);display:grid;place-items:center}
.it img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.it .q{position:absolute;right:-4px;bottom:-4px;background:var(--blue);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;font-weight:600}
.mid{text-align:center}
.mid .v{font-weight:700;font-size:16px;color:var(--blue2)}
.mid small{color:var(--mut);font-size:11px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.coin3d{perspective:500px;display:inline-block}
.coin{width:52px;height:52px;position:relative;transform-style:preserve-3d}
.coin .f{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:26px;border:3px solid #e0a800;background:radial-gradient(circle at 35% 30%,#fff1a8,#ffc83d)}
.coin .b{transform:rotateY(180deg)}
.coin.spin{animation:cf .55s linear infinite}
.coin.cat{transform:rotateY(180deg)}
.coin.big{width:96px;height:96px}.coin.big .f{font-size:46px}
@keyframes cf{to{transform:rotateY(360deg)}}
.cd{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--orange);background:conic-gradient(var(--orange) 0 70%,#ffe5bd 0);position:relative;margin:auto;animation:pulse 1s infinite}
.cd::before{content:'';position:absolute;inset:5px;background:#fff;border-radius:50%}
.cd i{position:relative;font-style:normal}
@keyframes pulse{50%{transform:scale(1.08)}}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgba(35,50,77,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:24px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{width:min(820px,100%)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mh{display:flex;align-items:center;margin-bottom:14px}
.mh h3{flex:1;font-size:21px}
.x{background:#eef4fc;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:340px;overflow:auto;padding:4px}
.gi{position:relative;border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center;cursor:pointer;background:#fbfdff;transition:.1s;user-select:none}
.gi:hover{border-color:var(--blue)}
.gi.sel{border-color:var(--mint);background:#effcf7}
.gi img{width:64px;height:64px;object-fit:contain}
.gi .nm{font-size:12px;font-weight:600;line-height:1.1;height:27px;overflow:hidden}
.gi .vl{font-size:12px;color:var(--blue2);font-weight:600}
.gi .cnt{position:absolute;top:4px;right:4px;background:var(--mint);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:1px 7px}
.tg{display:flex;gap:3px;justify-content:center;margin-top:2px}
.tg i{font-style:normal;font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:0 5px}
.tg .M{background:#b05cff}.tg .N{background:#22d3ee;color:#033}.tg .F{background:var(--pink)}.tg .R{background:var(--orange)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row input,.row select,.in{border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:0;background:#fff}
.row input[type=text],.in{flex:1;min-width:100px}
.in:focus,.row input:focus{border-color:var(--blue)}
.sides{display:flex;gap:10px}
.sd{flex:1;border:3px solid var(--line);border-radius:16px;padding:10px;text-align:center;background:#fff;font-weight:600;font-size:15px}
.sd.on{border-color:var(--blue);background:#e9f5ff}
.sd span{font-size:30px;display:block}
.game{display:flex;gap:14px;flex-wrap:wrap}
.gc{width:200px;border-radius:20px;overflow:hidden;border:3px solid var(--line);cursor:pointer;transition:.12s;background:#fff}
.gc:hover{transform:translateY(-4px);border-color:var(--blue)}
.gc .pic{height:130px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#8fd3ff,#ffe9a8)}
.gc b{display:block;text-align:center;padding:10px}
.bot{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:16px}
.bot .inf{flex:1}.bot .inf small{color:var(--mut)}
.on-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:5px}
.vs{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;align-items:start}
.vs .col{text-align:center;padding:10px;border-radius:18px;background:#f6fbff;border:2px solid var(--line);min-height:150px}
.vs .col.win{border-color:var(--orange);background:#fff8ea}
.vs .col .items{justify-content:center;margin-top:8px}
.vc{text-align:center;padding-top:20px}
.fair{margin-top:14px;padding:10px;border-radius:14px;background:#f3f8ff;font-size:12px;word-break:break-all;color:var(--mut)}
.fair code{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat{background:#f2f9ff;border-radius:16px;padding:14px;text-align:center}
.stat small{color:var(--mut)}.stat b{display:block;font-size:22px}
.pos{color:#18a877}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);text-align:left;font-weight:500;padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
.pg{display:flex;gap:6px;justify-content:center;margin-top:12px}
.pg button{min-width:34px;height:34px;border-radius:10px;background:#eef4fc;font-weight:600;color:var(--ink)}
.pg button.on{background:var(--blue);color:#fff}
.toasts{position:fixed;top:78px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#23324d;color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .15s;max-width:320px}
.toast.err{background:var(--red)}.toast.ok{background:#18a877}
#boot{position:fixed;inset:0;background:linear-gradient(#bfe6ff,#fff7e0);z-index:500;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.spin2{width:46px;height:46px;border:5px solid #fff;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.code{font-size:20px;font-weight:700;background:#fff8e0;border:2px dashed var(--sun);border-radius:14px;padding:14px;text-align:center;margin:12px 0;user-select:all}
.hint{color:var(--mut);font-size:13px;margin:6px 0}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:400}
.seg{display:flex;background:#eef4fc;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;background:transparent;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--blue2);box-shadow:0 2px 6px rgba(0,0,0,.1)}
@media(max-width:1000px){.main{grid-template-columns:1fr}.side{position:static;height:auto}.chat{height:420px;flex:none}
.match{grid-template-columns:1fr 1fr}.match .items,.match .mid,.match .acts{grid-column:1/-1}.acts{justify-content:flex-start}
.vs{grid-template-columns:1fr}.stats{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<div id="boot"><div class="spin2"></div><div id="bootmsg">Connecting…</div></div>
<canvas id="cf"></canvas>
<div class="toasts" id="toasts"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<div class="app">
<header>
  <div class="logo" data-act="home">AMP ROLL <small>🐾</small></div>
  <nav><a class="on" data-act="home">🪙 Coinflip</a></nav>
  <div class="right" id="hright"></div>
</header>

<div class="main" id="pgHome">
  <section>
    <div class="card">
      <div class="bar">
        <h2>🪙 Live Coinflips</h2>
        <span class="pill" id="cnt">0 games</span>
        <button class="btn sun" data-act="create">+ Create Match</button>
        <button class="btn gray" data-act="history">History</button>
      </div>
      <div id="lobby"></div>
    </div>
  </section>
  <aside class="side">
    <div id="gws" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="card chat">
      <div class="bar" style="margin-bottom:8px"><h2 style="font-size:17px">💬 Live Chat</h2><span class="pill" id="online">live</span></div>
      <div class="msgs" id="msgs"></div>
      <div class="cin"><input id="cin" maxlength="200" placeholder="Say something…"><button class="btn sm" data-act="send">Send</button></div>
    </div>
  </aside>
</div>

<div class="main" id="pgProfile" style="display:none;grid-template-columns:1fr"><div id="profile"></div></div>
</div>

<script>
/* ====== AYAR: Render URL'ni yaz (sonunda / olmasın) ====== */
const API_BASE = "https://YOUR-APP.onrender.com";
/* ========================================================= */
const BOT_NAME="DedokAmp";
const BOT_LINK="https://www.roblox.com/share?code=a0dd8a7bc68f034b99e078f454d4e903&type=Server";

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]);
const uname=u=>!u?'':(typeof u==='string'?u:(u.username||u.name||u.displayName||''));
const tsn=x=>typeof x==='number'?x:(Date.parse(x)||0);
let token=localStorage.getItem('amp_token')||'';
let ME=null, ST={matches:[],giveaways:[],chat:[],catalog:[]}, booted=false, socket=null;
let SEL={}, GC=null, VIEW=null, PH={}, CELEB={}, PAGE=1;

/* ---------- API ---------- */
async function api(path,opt={}){
  const h={'Content-Type':'application/json'};
  if(token){h.Authorization='Bearer '+token;h['x-token']=token;}
  const r=await fetch(API_BASE+path,{method:opt.method||(opt.body?'POST':'GET'),headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  let d={};const t=await r.text();try{d=JSON.parse(t)}catch{d={_text:t}}
  if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));
  return d;
}
function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3800)}
const fail=e=>toast(e.message||String(e),'err');

/* ---------- Item helpers ---------- */
function catMap(){const m={};arr(ST.catalog).forEach(c=>{m[c.id||c._id]=c});return m}
function resolve(e){const id=e.catalogId||e.id||e._id;const c=catMap()[id]||{};return {...c,...e,id,qty:e.qty||e.count||1}}
function inv(){return ME?arr(ME.inventory).map(resolve).filter(i=>i.qty>0):[]}
function itemImg(i){return i.image||i.img||i.imageUrl||i.url||''}
function tags(i){let s='';if(i.age==='mega'||i.mega)s+='<i class="M">M</i>';if(i.age==='neon'||i.neon)s+='<i class="N">N</i>';if(i.fly)s+='<i class="F">F</i>';if(i.ride)s+='<i class="R">R</i>';return s?`<div class="tg">${s}</div>`:''}
function thumb(i,max){return `<div class="it" title="${esc(i.name)} • ${fmt(i.value)}"><img src="${esc(itemImg(i))}" alt="" onerror="this.style.opacity=.2">${i.qty>1?`<span class="q">x${i.qty}</span>`:''}</div>`}
function thumbs(list,max=6){return list.slice(0,max).map(thumb).join('')+(list.length>max?`<div class="it"><b>+${list.length-max}</b></div>`:'')}
const sumV=l=>l.reduce((a,i)=>a+(Number(i.value)||0)*(i.qty||1),0);
function av(u,cls='',ring=false){const n=uname(u)||'?';const url=u&&(u.avatar||u.avatarUrl||u.avatar_url||u.headshot);
  return url?`<img class="av ${cls} ${ring?'ring':''}" src="${esc(url)}" alt="">`:`<span class="av ${cls} ${ring?'ring':''}">${esc(n[0]||'?').toUpperCase()}</span>`}
const sideIco=s=>s==='cat'?'🐱':'🐶';

/* ---------- Match normalize ---------- */
function nm(m){
  const s=String(m.status||m.state||'waiting').toLowerCase();
  const status=/cancel/.test(s)?'cancelled':/count|start/.test(s)?'countdown':/flip/.test(s)?'flipping':/fin|done|complet|end/.test(s)?'finished':'waiting';
  const host=m.host||m.creator||{};const joiner=m.joiner||m.opponent||m.guest||null;
  const hostItems=arr(m.hostItems||m.items||m.creatorItems).map(resolve);
  const joinItems=arr(m.joinerItems||m.joinItems||m.opponentItems||m.guestItems).map(resolve);
  const hostSide=m.hostSide||m.side||'dog';
  const o={raw:m,id:m.id||m._id,status,host,joiner,hostItems,joinItems,hostSide,joinSide:hostSide==='dog'?'cat':'dog',
    value:m.value||m.hostValue||sumV(hostItems),hash:m.hash||m.seedHash||m.commit,seed:m.seed||m.serverSeed,
    result:m.result||m.winnerSide||m.coin,finishedAt:tsn(m.finishedAt||m.endedAt)};
  let w=m.winner;let wn=uname(w);
  if(!wn&&(w==='host'||w==='joiner'))wn=uname(w==='host'?host:joiner);
  if(!wn&&o.result)wn=uname(o.result===hostSide?host:joiner);
  o.winnerName=wn;o.hostWon=!!wn&&wn===uname(host);
  o.joinValue=sumV(joinItems);
  return o;
}
function range(v){const r=Number((ST.config&&ST.config.range)||ST.range||0.10);return [v*(1-r),v*(1+r)]}
function phase(m,key,ms){const t=m.raw.countdownEnd||m.raw.startsAt;if(key==='countdown'&&t)return tsn(t);
  const k=m.id+key;if(!PH[k])PH[k]=Date.now();return PH[k]+ms}

/* ---------- Modal ---------- */
function openModal(html,wide){const m=$('#modal');m.className='modal'+(wide?' wide':'');m.innerHTML=html;$('#ov').classList.add('open')}
function closeModal(){$('#ov').classList.remove('open');GC=null;VIEW=null;SEL={}}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
const mh=t=>`<div class="mh"><h3>${t}</h3><button class="x" data-act="close">✕</button></div>`;

/* ---------- Header ---------- */
function renderHeader(){
  const h=$('#hright');
  if(!ME){h.innerHTML=`<button class="btn" data-act="login">Login with Roblox</button>`;return}
  const bal=sumV(inv());
  h.innerHTML=`<div class="wallet"><div class="w" data-act="wallet"><span style="font-size:22px">🐶</span><div><small>Adopt Me</small><b>${fmt(bal)}</b></div></div><button class="plus" data-act="deposit">+</button></div>
  <div class="user"><button data-act="umenu">${av(ME,'sm')}<span>${esc(ME.username||ME.name)}</span> ▾</button>

let busy=false;
async function refresh(){
  if(busy)return;busy=true;
  try{
    const d=await api('/api/state');ST={...ST,...d};
    if(d.bot)ST.bot=d.bot;
    if(token){try{const m=await api('/api/me');ME=m.user||m.me||m;if(!ME.username)ME=null}catch(e){if(/401|auth|token|session|login/i.test(e.message)){token='';localStorage.removeItem('amp_token');ME=null}}}
    else ME=null;
    if(!booted){booted=true;$('#boot').remove();connectSocket()}
    renderHeader();renderLobby();renderGW();renderChat();
    if(VIEW)renderView();
  }catch(e){if(!booted)$('#bootmsg').textContent='Server uyanıyor… (free plan ~30sn sürebilir)'}
  busy=false;
}
let rt=null;const sched=()=>{clearTimeout(rt);rt=setTimeout(refresh,150)};
setInterval(()=>{if(!document.hidden)refresh()},2000);
setInterval(()=>{ // tickers
  const now=Date.now();
  document.querySelectorAll('.cdn').forEach(e=>{const n=Math.ceil((+e.dataset.end-now)/1000);e.textContent=n>0?n:'…'});
  document.querySelectorAll('.gt').forEach(e=>{const s=Math.max(0,Math.ceil((+e.dataset.end-now)/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')});
},250);

function connectSocket(){
  if(socket){socket.disconnect()}
  socket=io(API_BASE,{auth:{token},transports:['websocket','polling']});
  socket.onAny((ev,...a)=>{
    const p=a[0];
    if(/err/i.test(ev)){const m=typeof p==='string'?p:(p&&(p.message||p.error));if(m)toast(m,'err');return}
    if(/^chat/i.test(ev)){
      if(Array.isArray(p)){ST.chat=p;renderChat()}
      else if(p&&(p.text||p.message)){ST.chat=arr(ST.chat);if(!p.id||!ST.chat.some(c=>c.id===p.id)){ST.chat.push(p)}renderChat()}
      else sched();return}
    if(/online|count/i.test(ev)&&typeof p==='number'){$('#online').textContent=p+' online';return}
    sched();
  });
}

async function hex(buf){return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function verify(id){
  const m=arr(ST.matches).map(nm).find(x=>x.id===id);if(!m)return;const te=new TextEncoder();
  try{const h=await hex(await crypto.subtle.digest('SHA-256',te.encode(m.seed)));
    const k=await crypto.subtle.importKey('raw',te.encode(m.seed),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    const s=await hex(await crypto.subtle.sign('HMAC',k,te.encode(String(id))));
    const r=parseInt(s.slice(0,8),16)/4294967296;const side=r<0.5?'dog':'cat';
    $('#vres').innerHTML=h===m.hash?`<b class="pos">✔ Hash matches. Result: ${sideIco(side)} ${side} (${r.toFixed(6)})</b>`:`<b class="neg">✘ Hash mismatch!</b>`;
  }catch(e){fail(e)}
}

    const r=await fetch(API_BASE+'/api/admin/ui',{headers:h});if(!r.ok)throw new Error('Not allowed');
    let js=await r.text();try{const j=JSON.parse(js);js=j.js||j.code||js}catch{}
    window.AMP={api,esc,toast,fmt,tags};
    if(!window.__ampAdminLoaded){new Function(js)();window.__ampAdminLoaded=true}
    const f=window.AMP.openAdmin||window.AMP.open||window.openAdmin||window.AMP_ADMIN&&window.AMP_ADMIN.open;if(typeof f==='function')f();
  }catch(e){fail(e)}
}

/* ---------- Confetti ---------- */
function confetti(){
  const c=$('#cf');const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,s:4+Math.random()*6,c:['#2f9bff','#ffc83d','#ff7eb6','#3fcf9f','#ff9f1c'][Math.random()*5|0]}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<110)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- Click router ---------- */
const ACT={
  home(){closeModal();show('home')},close:closeModal,login:showLogin,lstart:loginStart,lverify:loginVerify,
  umenu(){$('#umenu').classList.toggle('open')},
  profile(){showProfile(1)},ppage(t){showProfile(+t.dataset.p)},giveaway:showGiveaway,admin:openAdmin,
  logout(){token='';localStorage.removeItem('amp_token');ME=null;if(socket){socket.auth={};socket.disconnect().connect()}renderHeader();show('home');toast('Logged out')},
  wallet:showWallet,deposit:showDeposit,bots:showBots,botjoin(){window.open((ST.bot&&(ST.bot.joinLink||ST.bot.link))||BOT_LINK,'_blank','noopener')},
  withdraw,create:showCreate,docreate:doCreate,join(t){showJoin(t.dataset.id)},dojoin(t){doJoin(t.dataset.id)},
  cancel(t){cancelMatch(t.dataset.id)},view(t){showView(t.dataset.id)},verify(t){verify(t.dataset.id)},history:showHistory,
  side(t){CSIDE=t.dataset.s;document.querySelectorAll('#sides .sd').forEach(e=>e.classList.toggle('on',e===t))},
  pick(t){const i=GC.list().find(x=>String(x.id)===t.dataset.id);if(!i)return;const c=(SEL[i.id]||0)+1;SEL[i.id]=c>i.qty?0:c;renderGrid()},
  selall(){GC.list().forEach(i=>SEL[i.id]=i.qty);renderGrid()},selnone(){SEL={};renderGrid()},
  gmode(t){GMODE=t.dataset.m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b===t));gOpts()},
  gcreate:gCreate,genter(t){gEnter(t.dataset.id)},send:sendChat
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('.user')){const m=$('#umenu');m&&m.classList.remove('open')}
  if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.dataset.act!=='umenu'){const m=$('#umenu');m&&m.classList.remove('open')}f(t,e)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

renderHeader();renderLobby();refresh();
</script>
